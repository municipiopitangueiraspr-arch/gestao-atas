<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intranet · Gestão Pitangueiras</title>

    <!-- Font Awesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <style>
      /* ===== CSS SEPARADO · MODAL LOGIN ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
      }

      body {
        background: linear-gradient(145deg, #e8f5e9 0%, #e2eaf1 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
      }

      /* cartão principal */
      .portal-prefeitura {
        max-width: 1200px;
        width: 100%;
        background: white;
        border-radius: 40px;
        padding: 3rem 2.5rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        border: 1px solid #e2e8f0;
        transition: all 0.2s;
      }

      /* ===== CABEÇALHO COM BRASÃO OFICIAL (PNG) ===== */
      .brasao-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-bottom: 2.5rem;
      }

      .brasao-img-container {
        width: 130px;
        height: 130px;
        background: white;
        border-radius: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.1);
        border: 3px solid white;
        outline: 2px solid #0d5e3a;
        margin-bottom: 1.5rem;
        padding: 8px;
      }

      .brasao-oficial {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 50%;
        background: white;
      }

      .boas-vindas {
        text-align: center;
      }

      .boas-vindas h1 {
        font-size: 2.3rem;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.02em;
        margin-bottom: 0.3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .boas-vindas h1 i {
        color: #0d5e3a;
      }

      .departamento-tag {
        background: #f0fdf4;
        padding: 0.6rem 1.8rem;
        border-radius: 60px;
        font-size: 1rem;
        color: #1a3a6b;
        border: 1px solid #c6f6d5;
        display: inline-block;
        margin-top: 0.3rem;
      }

      .departamento-tag i {
        color: #0d5e3a;
        margin-right: 8px;
      }

      /* ===== SISTEMA DE NOTIFICAÇÕES ===== */
      .notification-center {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        pointer-events: none;
      }

      .notification-toast {
        pointer-events: all;
        background: white;
        border-radius: 16px;
        padding: 16px 24px;
        min-width: 320px;
        max-width: 500px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        display: flex;
        align-items: flex-start;
        gap: 14px;
        animation: notificationSlideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        border-left: 5px solid;
        position: relative;
        transition: all 0.3s;
      }

      .notification-toast.removing {
        animation: notificationSlideDown 0.3s ease-in forwards;
      }

      @keyframes notificationSlideUp {
        0% {
          opacity: 0;
          transform: translateY(30px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes notificationSlideDown {
        0% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(30px);
        }
      }

      .notification-toast.notification-success {
        border-left-color: #0d5e3a;
        background: #f0fdf4;
      }
      .notification-toast.notification-error {
        border-left-color: #e53e3e;
        background: #fff5f5;
      }
      .notification-toast.notification-warning {
        border-left-color: #d69e2e;
        background: #fffff0;
      }
      .notification-toast.notification-info {
        border-left-color: #1a3a6b;
        background: #ebf4ff;
      }

      .notification-icon {
        font-size: 24px;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .notification-content {
        flex: 1;
      }
      .notification-title {
        font-weight: 700;
        font-size: 15px;
        margin-bottom: 4px;
      }
      .notification-success .notification-title {
        color: #0d5e3a;
      }
      .notification-error .notification-title {
        color: #e53e3e;
      }
      .notification-warning .notification-title {
        color: #d69e2e;
      }
      .notification-info .notification-title {
        color: #1a3a6b;
      }
      .notification-message {
        font-size: 13px;
        color: #475569;
        line-height: 1.4;
      }

      .notification-close {
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: #a0aec0;
        flex-shrink: 0;
        margin-top: -2px;
        width: 24px;
        height: 24px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      .notification-close:hover {
        background: rgba(0, 0, 0, 0.05);
        color: #0f172a;
      }

      /* ===== MODAIS ===== */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.2s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .modal-confirm {
        background: white;
        border-radius: 20px;
        padding: 32px;
        max-width: 420px;
        width: 90%;
        text-align: center;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        border: 1px solid #e2e8f0;
        animation: modalPop 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes modalPop {
        0% {
          transform: scale(0.9);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .modal-confirm-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }
      .modal-confirm h3 {
        font-size: 20px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 8px;
      }
      .modal-confirm p {
        font-size: 14px;
        color: #475569;
        margin-bottom: 24px;
        line-height: 1.5;
      }
      .modal-confirm-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      /* Modal de Login customizado */
      .modal-login {
        background: white;
        border-radius: 24px;
        padding: 40px 32px;
        max-width: 420px;
        width: 90%;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        border: 1px solid #e2e8f0;
        animation: modalPop 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        text-align: left;
      }
      .modal-login-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 28px;
      }
      .modal-login-header .brasao-mini {
        width: 70px;
        height: 70px;
        background: linear-gradient(135deg, #0d5e3a, #1a3a6b);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: white;
        margin-bottom: 16px;
      }
      .modal-login-header h2 {
        font-size: 22px;
        font-weight: 800;
        color: #0f172a;
      }
      .modal-login-header p {
        font-size: 13px;
        color: #718096;
      }

      .form-group {
        margin-bottom: 18px;
      }
      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #4a5568;
        margin-bottom: 6px;
      }

      .input-wrapper {
        position: relative;
      }
      .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        color: #a0aec0;
      }
      .form-input {
        width: 100%;
        padding: 12px 14px 12px 44px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        font-size: 14px;
        transition: border-color 0.2s;
        background: white;
        outline: none;
      }
      .form-input:focus {
        border-color: #0d5e3a;
        box-shadow: 0 0 0 3px rgba(13, 94, 58, 0.1);
      }

      .btn {
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: inherit;
      }
      .btn-primary {
        background: #0d5e3a;
        color: white;
        width: 100%;
      }
      .btn-primary:hover {
        background: #0a4a2e;
      }
      .btn-secondary {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #e2e8f0;
      }
      .btn-secondary:hover {
        background: #e2e8f0;
      }

      .modal-footer-link {
        text-align: center;
        margin-top: 16px;
        font-size: 13px;
        color: #718096;
      }
      .modal-footer-link a {
        color: #0d5e3a;
        text-decoration: none;
        font-weight: 600;
      }
      .modal-footer-link a:hover {
        text-decoration: underline;
      }

      /* responsividade */
      @media (max-width: 650px) {
        .portal-prefeitura {
          padding: 2rem 1.5rem;
        }
        .boas-vindas h1 {
          font-size: 1.8rem;
        }
        .notification-toast {
          min-width: 90%;
          max-width: 90%;
        }
      }
    </style>
  </head>
  <body>
    <!-- ========== MODAL DE LOGIN ========== -->
    <div class="modal-overlay" id="loginModalOverlay">
      <div class="modal-login">
        <div class="modal-login-header">
          <div class="brasao-mini">🏛️</div>
          <h2>Intranet Municipal</h2>
          <p>Acesso restrito a servidores autorizados</p>
        </div>
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="loginEmail">E-mail</label>
            <div class="input-wrapper">
              <span class="input-icon">📧</span>
              <input
                type="email"
                id="loginEmail"
                class="form-input"
                placeholder="seu.email@prefeitura.gov.br"
                required
                autocomplete="email"
              />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginSenha">Senha</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                id="loginSenha"
                class="form-input"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="btnEntrar">
            <span>🔐</span> Entrar
          </button>
        </form>
        <div class="modal-footer-link">
          <a
            href="#"
            onclick="
              event.preventDefault();
              showNotification(
                'info',
                'Esqueceu a senha?',
                'Entre em contato com o suporte de TI para redefinir sua senha.',
              );
            "
          >
            Esqueceu a senha?
          </a>
        </div>
      </div>
    </div>

    <!-- CONTÊINER DE NOTIFICAÇÕES -->
    <div class="notification-center" id="notificationCenter"></div>

    <!-- Supabase SDK e lógica -->
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
        }
      }
    </script>

    <script type="module">
      import { createClient } from "@supabase/supabase-js";

      // Configuração do Supabase
      const SUPABASE_URL = "https://qgkjnzcqjhhqdgxmvtew.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_gbXPIpkbYvf3YKITplkjpg_eKrPHhYw";
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // ============================================
      // SISTEMA DE NOTIFICAÇÕES
      // ============================================
      window.showNotification = function (
        type,
        title,
        message,
        duration = 4000,
      ) {
        const container = document.getElementById("notificationCenter");
        const icons = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };
        const toast = document.createElement("div");
        toast.className = `notification-toast notification-${type}`;
        toast.innerHTML = `
          <span class="notification-icon">${icons[type]}</span>
          <div class="notification-content">
            <div class="notification-title">${title}</div>
            <div class="notification-message">${message}</div>
          </div>
          <button class="notification-close" onclick="this.parentElement.remove()">✕</button>
        `;
        container.appendChild(toast);
        if (duration > 0) {
          setTimeout(() => {
            if (toast.parentElement) {
              toast.classList.add("removing");
              setTimeout(() => toast.remove(), 300);
            }
          }, duration);
        }
        return toast;
      };

      // ============================================
      // MODAL DE CONFIRMAÇÃO
      // ============================================
      window.showConfirm = function (title, message, onConfirm) {
        const overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.innerHTML = `
          <div class="modal-confirm">
            <div class="modal-confirm-icon">❓</div>
            <h3>${title}</h3>
            <p>${message}</p>
            <div class="modal-confirm-actions">
              <button class="btn btn-secondary" id="cancelBtn">Cancelar</button>
              <button class="btn btn-primary" id="confirmBtn">Confirmar</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);

        const closeModal = () => {
          overlay.style.opacity = "0";
          setTimeout(() => overlay.remove(), 200);
        };

        overlay
          .querySelector("#cancelBtn")
          .addEventListener("click", closeModal);
        overlay.querySelector("#confirmBtn").addEventListener("click", () => {
          closeModal();
          if (typeof onConfirm === "function") onConfirm();
        });
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) closeModal();
        });
        return overlay;
      };

      // ============================================
      // FUNÇÃO DE LOGIN - REDIRECIONA PARA INTRANET
      // ============================================
      async function fazerLogin(email, senha) {
        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password: senha,
          });
          if (error) throw new Error(error.message);

          // Buscar dados do usuário na tabela 'usuarios'
          const { data: usuario, error: userError } = await supabase
            .from("usuarios")
            .select("id, nome, email, perfil, orgao_id")
            .eq("uuid", data.user.id)
            .single();

          if (userError || !usuario) {
            await supabase.auth.signOut();
            throw new Error(
              "Usuário não possui perfil no sistema. Contate o administrador.",
            );
          }

          // Redirecionar para a intranet (hall completo com seção administrativa)
          window.showNotification(
            "success",
            "Autenticado",
            `Bem-vindo, ${usuario.nome}! Redirecionando...`,
          );

          // Pequeno delay para a notificação aparecer
          setTimeout(() => {
            window.location.href = "intranet.html";
          }, 1000);
        } catch (err) {
          window.showNotification(
            "error",
            "Falha na autenticação",
            err.message,
          );
          console.error(err);
        }
      }

      // ============================================
      // VERIFICAR SESSÃO EXISTENTE
      // ============================================
      async function verificarSessaoExistente() {
        const {
          data: { session },
        } = await supabase.auth.getSession();
        if (session) {
          // Se já está logado, redireciona para intranet
          window.location.href = "intranet.html";
        } else {
          // Mostrar modal de login
          document.getElementById("loginModalOverlay").style.display = "flex";
          document.getElementById("loginEmail").focus();
        }
      }

      // ============================================
      // EVENTO DE SUBMIT DO FORMULÁRIO DE LOGIN
      // ============================================
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value.trim();
          const senha = document.getElementById("loginSenha").value.trim();
          if (!email || !senha) {
            window.showNotification(
              "warning",
              "Campos obrigatórios",
              "Preencha e-mail e senha.",
            );
            return;
          }
          await fazerLogin(email, senha);
        });

      // ============================================
      // INICIALIZAÇÃO
      // ============================================
      document.addEventListener("DOMContentLoaded", async () => {
        await verificarSessaoExistente();
      });
    </script>
  </body>
</html>
