<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Permissões · Core</title>

    <!-- Font Awesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <style>
      /* ============================================ */
      /* DESIGN SYSTEM - VARIÁVEIS GLOBAIS            */
      /* ============================================ */
      :root {
        --primary-50: #ecfdf5;
        --primary-100: #d1fae5;
        --primary-200: #a7f3d0;
        --primary-300: #6ee7b7;
        --primary-400: #34d399;
        --primary-500: #10b981;
        --primary-600: #0d5e3a;
        --primary-700: #1a3a6b;
        --primary-800: #064e3b;
        --primary-900: #022c22;

        --success-50: #ecfdf5;
        --success-100: #d1fae5;
        --success-200: #a7f3d0;
        --success-300: #6ee7b7;
        --success-400: #34d399;
        --success-500: #10b981;
        --success-600: #059669;
        --success-700: #047857;
        --success-800: #065f46;

        --warning-50: #fffbeb;
        --warning-100: #fef3c7;
        --warning-200: #fde68a;
        --warning-300: #fcd34d;
        --warning-400: #fbbf24;
        --warning-500: #f59e0b;
        --warning-600: #d97706;
        --warning-700: #b45309;
        --warning-800: #92400e;

        --error-50: #fef2f2;
        --error-100: #fee2e2;
        --error-200: #fecaca;
        --error-300: #fca5a5;
        --error-400: #f87171;
        --error-500: #ef4444;
        --error-600: #dc2626;
        --error-700: #b91c1c;
        --error-800: #991b1b;

        --neutral-50: #f8fafc;
        --neutral-100: #f1f5f9;
        --neutral-200: #e2e8f0;
        --neutral-300: #cbd5e1;
        --neutral-400: #94a3b8;
        --neutral-500: #64748b;
        --neutral-600: #475569;
        --neutral-700: #334155;
        --neutral-800: #1e293b;
        --neutral-900: #0f172a;

        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md:
          0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg:
          0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-xl:
          0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        --transition-base: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --border-radius-sm: 0.375rem;
        --border-radius-md: 0.5rem;
        --border-radius-lg: 0.75rem;
        --border-radius-xl: 1rem;
        --border-radius-2xl: 1.25rem;
      }

      /* ============================================ */
      /* RESET E BASE                                 */
      /* ============================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #f1f5f9 0%, #e6edf5 100%);
        color: var(--neutral-900);
        min-height: 100vh;
        line-height: 1.5;
        font-size: 14px;
        position: relative;
      }

      /* ============================================ */
      /* CORE HEADER                                  */
      /* ============================================ */
      .core-header {
        background: linear-gradient(
          135deg,
          var(--primary-700),
          var(--neutral-800)
        );
        color: white;
        padding: 16px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        box-shadow: var(--shadow-xl);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .core-header .header-left {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .core-header .header-left h1 {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
      }

      .core-header .header-left h1 i {
        color: var(--primary-300);
        margin-right: 10px;
      }

      .btn-toggle-sidebar {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: white;
        font-size: 1.2rem;
        padding: 8px 12px;
        border-radius: var(--border-radius-md);
        cursor: pointer;
        transition: var(--transition-base);
      }

      .btn-toggle-sidebar:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .core-header .header-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 40px;
        backdrop-filter: blur(10px);
      }

      .user-avatar {
        width: 32px;
        height: 32px;
        background: linear-gradient(
          135deg,
          var(--primary-400),
          var(--primary-500)
        );
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--neutral-900);
        font-weight: 700;
        font-size: 0.8rem;
      }

      .btn {
        padding: 8px 18px;
        border-radius: var(--border-radius-lg);
        font-weight: 600;
        cursor: pointer;
        border: none;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: var(--transition-base);
        font-family: inherit;
      }

      .btn-outline {
        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: white;
      }

      .btn-outline:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .btn-sm {
        padding: 6px 14px;
        font-size: 0.8rem;
      }

      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--primary-600),
          var(--primary-700)
        );
        color: white;
        box-shadow: var(--shadow-sm);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .btn-success {
        background: var(--success-600);
        color: white;
      }

      .btn-success:hover {
        background: var(--success-700);
        transform: translateY(-2px);
      }

      .btn-danger {
        background: var(--error-600);
        color: white;
      }

      .btn-danger:hover {
        background: var(--error-700);
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #e2e8f0;
      }

      .btn-secondary:hover {
        background: #e2e8f0;
      }

      .badge-perfil {
        background: rgba(255, 255, 255, 0.2);
        padding: 2px 10px;
        border-radius: 40px;
        font-size: 0.65rem;
        font-weight: 600;
        color: white;
      }

      /* ============================================ */
      /* CORE SIDEBAR                                 */
      /* ============================================ */
      .core-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 260px;
        height: 100vh;
        background: linear-gradient(
          180deg,
          var(--neutral-800),
          var(--neutral-900)
        );
        color: rgba(255, 255, 255, 0.8);
        padding-top: 80px;
        z-index: 90;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        overflow-y: auto;
      }

      .core-sidebar.open {
        transform: translateX(0);
      }

      .sidebar-nav ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .sidebar-nav li {
        margin: 2px 12px;
      }

      .sidebar-nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        border-radius: var(--border-radius-lg);
        transition: var(--transition-base);
        font-size: 0.9rem;
        font-weight: 500;
      }

      .sidebar-nav a:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }

      .sidebar-nav li.active a {
        background: rgba(255, 255, 255, 0.15);
        color: white;
      }

      .sidebar-nav a i {
        width: 20px;
        text-align: center;
      }

      .sidebar-divider {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        margin: 8px 16px;
      }

      .sidebar-footer {
        padding: 16px 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 0.7rem;
        opacity: 0.5;
        text-align: center;
        margin-top: 16px;
      }

      /* ============================================ */
      /* CORE MAIN                                   */
      /* ============================================ */
      .core-main {
        margin-left: 0;
        padding: 0;
        min-height: calc(100vh - 70px);
      }

      /* ============================================ */
      /* PERMISSOES CONTAINER                         */
      /* ============================================ */
      .permissoes-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      /* ============================================ */
      /* PAGE HEADER                                  */
      /* ============================================ */
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 16px;
      }

      .page-header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--neutral-900);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .page-header h1 i {
        color: var(--primary-600);
      }

      .page-header p {
        font-size: 0.85rem;
        color: var(--neutral-500);
        margin-top: 4px;
      }

      /* ============================================ */
      /* FILTERS BAR                                  */
      /* ============================================ */
      .filters-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        background: white;
        padding: 20px 24px;
        border-radius: var(--border-radius-2xl);
        box-shadow: var(--shadow-md);
        border: 1px solid var(--neutral-200);
        margin-bottom: 24px;
        align-items: flex-end;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 180px;
      }

      .filter-group label {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--neutral-500);
        letter-spacing: 0.5px;
      }

      .filter-group select,
      .filter-group input {
        padding: 10px 14px;
        border: 2px solid var(--neutral-200);
        border-radius: var(--border-radius-lg);
        font-size: 0.9rem;
        transition: var(--transition-base);
        background: white;
        width: 100%;
      }

      .filter-group select:focus,
      .filter-group input:focus {
        outline: none;
        border-color: var(--primary-500);
        box-shadow: 0 0 0 4px var(--primary-100);
      }

      /* ============================================ */
      /* CARD                                        */
      /* ============================================ */
      .card {
        background: white;
        border-radius: var(--border-radius-2xl);
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--neutral-200);
        overflow: hidden;
      }

      /* ============================================ */
      /* TABELA                                      */
      /* ============================================ */
      .table-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .table th {
        background: linear-gradient(
          135deg,
          var(--primary-700),
          var(--neutral-800)
        );
        padding: 14px 16px;
        text-align: left;
        font-size: 0.75rem;
        font-weight: 600;
        color: white;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--neutral-200);
        color: var(--neutral-700);
        background: white;
        vertical-align: middle;
      }

      .table tbody tr:hover td {
        background: var(--neutral-50);
      }

      .table .acoes-cell {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      /* ============================================ */
      /* BADGES                                      */
      /* ============================================ */
      .badge-perfil-sistema {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 40px;
        font-size: 0.7rem;
        font-weight: 600;
      }

      .badge-perfil-sistema.admin {
        background: linear-gradient(135deg, var(--error-100), var(--error-200));
        color: var(--error-800);
      }

      .badge-perfil-sistema.secretario {
        background: linear-gradient(
          135deg,
          var(--success-100),
          var(--success-200)
        );
        color: var(--success-800);
      }

      .badge-perfil-sistema.solicitante {
        background: linear-gradient(
          135deg,
          var(--primary-100),
          var(--primary-200)
        );
        color: var(--primary-800);
      }

      .badge-perfil-sistema.estagiario {
        background: linear-gradient(
          135deg,
          var(--warning-100),
          var(--warning-200)
        );
        color: var(--warning-800);
      }

      .badge-permissao {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 0.65rem;
        font-weight: 600;
      }

      .badge-permissao.admin {
        background: var(--error-100);
        color: var(--error-800);
      }

      .badge-permissao.permitido {
        background: var(--success-100);
        color: var(--success-800);
      }

      .badge-permissao.negado {
        background: var(--neutral-100);
        color: var(--neutral-600);
      }

      .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 40px;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .status-ativo {
        background: var(--success-100);
        color: var(--success-800);
      }

      .status-inativo {
        background: var(--error-100);
        color: var(--error-800);
      }

      .avatar-mini {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          var(--primary-600),
          var(--primary-700)
        );
        color: white;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.72rem;
        flex-shrink: 0;
        border: 2px solid white;
        box-shadow: var(--shadow-sm);
      }

      .usuario-cell {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .usuario-info {
        min-width: 0;
      }

      .usuario-info strong {
        display: block;
        color: var(--neutral-900);
        font-size: 0.9rem;
        margin-bottom: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .usuario-info span {
        font-size: 0.72rem;
        color: var(--neutral-500);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ============================================ */
      /* MODULOS GRID                                  */
      /* ============================================ */
      .modulos-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 10px;
        margin-top: 8px;
      }

      .modulo-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        background: var(--neutral-50);
        border-radius: var(--border-radius-md);
        border: 2px solid var(--neutral-200);
        transition: var(--transition-base);
      }

      .modulo-item:hover {
        border-color: var(--primary-300);
        background: white;
      }

      .modulo-item.ativo {
        background: var(--primary-50);
        border-color: var(--primary-400);
      }

      .modulo-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--primary-600);
        cursor: pointer;
        flex-shrink: 0;
      }

      .modulo-item label {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--neutral-700);
        cursor: pointer;
        text-transform: none;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        letter-spacing: normal;
      }

      .modulo-item label i {
        color: var(--primary-600);
        width: 18px;
        text-align: center;
      }

      .modulo-item.ativo label {
        color: var(--primary-800);
        font-weight: 600;
      }

      /* ============================================ */
      /* EMPTY STATE                                  */
      /* ============================================ */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--neutral-400);
      }

      .empty-state .empty-icon {
        font-size: 48px;
        display: block;
        margin-bottom: 16px;
      }

      .empty-state p {
        font-size: 0.95rem;
        margin-bottom: 16px;
      }

      /* ============================================ */
      /* LOADING                                     */
      /* ============================================ */
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        color: var(--neutral-500);
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid var(--neutral-200);
        border-top-color: var(--primary-600);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ============================================ */
      /* TOAST                                      */
      /* ============================================ */
      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .toast {
        min-width: 280px;
        max-width: 380px;
        padding: 14px 18px;
        border-radius: var(--border-radius-lg);
        box-shadow: var(--shadow-xl);
        display: flex;
        align-items: center;
        gap: 12px;
        animation: slideInToast 0.3s ease;
        background: white;
        border-left: 4px solid;
      }

      .toast.sucesso {
        border-left-color: var(--success-600);
      }
      .toast.erro {
        border-left-color: var(--error-600);
      }
      .toast.aviso {
        border-left-color: var(--warning-600);
      }
      .toast.info {
        border-left-color: var(--primary-600);
      }

      .toast i {
        font-size: 1.2rem;
      }
      .toast.sucesso i {
        color: var(--success-600);
      }
      .toast.erro i {
        color: var(--error-600);
      }
      .toast.aviso i {
        color: var(--warning-600);
      }
      .toast.info i {
        color: var(--primary-600);
      }

      .toast span.msg {
        flex: 1;
        font-size: 0.9rem;
        color: var(--neutral-800);
      }

      .toast .btn-fechar {
        background: none;
        border: none;
        color: var(--neutral-400);
        cursor: pointer;
        font-size: 1rem;
        padding: 0;
      }

      .toast .btn-fechar:hover {
        color: var(--neutral-600);
      }

      @keyframes slideInToast {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* ============================================ */
      /* MODAL                                       */
      /* ============================================ */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.2s ease;
        padding: 16px;
      }

      .modal-container {
        background: white;
        border-radius: var(--border-radius-2xl);
        width: 100%;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-xl);
        animation: modalPop 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .modal-md {
        max-width: 720px;
      }

      .modal-sm {
        max-width: 500px;
      }

      .modal-header {
        padding: 20px 24px;
        border-bottom: 2px solid var(--neutral-200);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      .modal-header h2 {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--neutral-900);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .modal-header h2 i {
        color: var(--primary-600);
      }

      .modal-close {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--neutral-500);
        transition: var(--transition-base);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .modal-close:hover {
        background: var(--neutral-100);
        color: var(--neutral-900);
      }

      .modal-body {
        padding: 24px;
        overflow-y: auto;
        flex: 1;
      }

      .modal-footer {
        padding: 16px 24px;
        border-top: 1px solid var(--neutral-200);
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        flex-wrap: wrap;
      }

      /* ============================================ */
      /* MODAL USER HEADER                            */
      /* ============================================ */
      .modal-user-header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        background: var(--primary-50);
        border: 1px solid var(--primary-200);
        border-radius: var(--border-radius-lg);
        margin-bottom: 20px;
      }

      .modal-user-header .avatar-lg {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          var(--primary-600),
          var(--primary-700)
        );
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.1rem;
        flex-shrink: 0;
        box-shadow: var(--shadow-md);
      }

      .modal-user-header .info {
        flex: 1;
        min-width: 0;
      }

      .modal-user-header .info strong {
        display: block;
        color: var(--neutral-900);
        font-size: 1rem;
        margin-bottom: 2px;
      }

      .modal-user-header .info span {
        font-size: 0.78rem;
        color: var(--neutral-600);
      }

      /* ============================================ */
      /* MODAL CONTROLES LOTE                        */
      /* ============================================ */
      .modulos-controles {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding-bottom: 12px;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--neutral-200);
      }

      .modulos-controles .info {
        font-size: 0.82rem;
        color: var(--neutral-600);
      }

      .modulos-controles .info strong {
        color: var(--primary-800);
        font-weight: 700;
      }

      .modulos-controles .botoes {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* ============================================ */
      /* FORMULÁRIO                                  */
      /* ============================================ */
      .form-hint {
        background: var(--primary-50);
        border: 1px solid var(--primary-200);
        border-radius: var(--border-radius-lg);
        padding: 12px 16px;
        font-size: 0.8rem;
        color: var(--primary-800);
        margin-bottom: 16px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        line-height: 1.5;
      }

      .form-hint i {
        color: var(--primary-600);
        margin-top: 2px;
        flex-shrink: 0;
      }

      /* ============================================ */
      /* MODAL DE CONFIRMAÇÃO                        */
      /* ============================================ */
      .modal-confirm {
        background: white;
        border-radius: var(--border-radius-2xl);
        padding: 40px 32px;
        max-width: 440px;
        width: 100%;
        text-align: center;
        box-shadow: var(--shadow-xl);
        animation: modalPop 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid var(--neutral-200);
      }

      .modal-confirm-icon {
        font-size: 2.5rem;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--warning-50);
        margin-left: auto;
        margin-right: auto;
      }

      .modal-confirm-title {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--neutral-900);
        margin-bottom: 12px;
      }

      .modal-confirm-message {
        font-size: 0.95rem;
        color: var(--neutral-600);
        margin-bottom: 28px;
        line-height: 1.6;
        white-space: pre-line;
      }

      .modal-confirm-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      .modal-confirm-actions .btn {
        min-width: 120px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes modalPop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* ============================================ */
      /* STATS FOOTER                                 */
      /* ============================================ */
      .stats-footer {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        padding: 16px 0;
        border-top: 1px solid var(--neutral-200);
        margin-top: 16px;
        font-size: 0.85rem;
        color: var(--neutral-500);
      }

      .stats-footer span {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .stats-footer strong {
        color: var(--neutral-800);
      }

      /* ============================================ */
      /* PAGINAÇÃO                                   */
      /* ============================================ */
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        padding: 16px 0;
        border-top: 1px solid var(--neutral-200);
      }

      .btn-page {
        padding: 8px 16px;
        border: 1px solid var(--neutral-200);
        background: white;
        border-radius: var(--border-radius-md);
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--neutral-700);
        transition: var(--transition-base);
      }

      .btn-page:hover:not(:disabled) {
        background: var(--neutral-50);
        border-color: var(--primary-300);
      }

      .btn-page:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .page-info {
        font-size: 0.85rem;
        color: var(--neutral-500);
        font-weight: 500;
      }

      /* ============================================ */
      /* RESPONSIVIDADE                               */
      /* ============================================ */
      @media (min-width: 769px) {
        .core-sidebar {
          transform: translateX(0) !important;
        }
        .core-main {
          margin-left: 260px;
        }
        .btn-toggle-sidebar {
          display: none;
        }
      }

      @media (max-width: 1024px) {
        .filters-bar {
          flex-direction: column;
          align-items: stretch;
        }
        .filter-group {
          min-width: auto;
        }
        .modulos-grid {
          grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }
      }

      @media (max-width: 768px) {
        .core-header {
          padding: 12px 16px;
        }
        .core-header .header-left h1 {
          font-size: 1.1rem;
        }
        .user-info span:not(.user-avatar) {
          display: none;
        }
        .permissoes-container {
          padding: 16px;
        }
        .page-header {
          flex-direction: column;
          align-items: stretch;
          gap: 12px;
        }
        .page-header h1 {
          font-size: 1.4rem;
        }
        .table {
          font-size: 0.8rem;
        }
        .table th,
        .table td {
          padding: 10px 12px;
        }
        .btn {
          padding: 8px 14px;
          font-size: 0.8rem;
        }
        .modal-container {
          width: 95%;
          max-height: 95vh;
        }
        .stats-footer {
          flex-direction: column;
          gap: 8px;
          font-size: 0.8rem;
        }
        .modulos-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 480px) {
        .permissoes-container {
          padding: 12px;
        }
        .page-header h1 {
          font-size: 1.2rem;
        }
        .filters-bar {
          padding: 16px;
        }
        .table th,
        .table td {
          padding: 8px 10px;
          font-size: 0.75rem;
        }
        .btn-sm {
          padding: 4px 8px;
          font-size: 0.7rem;
        }
        .toast {
          min-width: 90%;
          max-width: 90%;
        }
        .modal-confirm {
          padding: 24px 16px;
        }
      }

      /* ============================================ */
      /* IMPRESSÃO                                  */
      /* ============================================ */
      @media print {
        .core-header,
        .core-sidebar,
        .filters-bar,
        .btn,
        .btn-sm,
        .btn-page,
        .toast-container,
        .modal-overlay {
          display: none !important;
        }

        .core-main {
          margin-left: 0 !important;
        }

        .card {
          box-shadow: none !important;
          border: 1px solid #ccc !important;
          break-inside: avoid;
          page-break-inside: avoid;
        }

        .table th {
          background: #eee !important;
          color: #000 !important;
        }

        .table td {
          border-bottom: 1px solid #ddd !important;
        }

        .permissoes-container {
          padding: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ============================================ -->
    <!-- HEADER                                      -->
    <!-- ============================================ -->
    <header class="core-header" id="coreHeader">
      <div class="header-left">

    <aside class="core-sidebar" id="coreSidebar">

          <li><hr class="sidebar-divider" /></li>
          <li>
            <a href="../../intranet.html">
              <i class="fas fa-arrow-left"></i> Voltar para Intranet

      <div class="sidebar-footer">

    <!-- ============================================ -->

    <main class="core-main">

      </div>

    <!-- ============================================ -->
    <!-- TOAST CONTAINER                             -->

    <div id="toastContainer" class="toast-container"></div>

    <!-- ============================================ -->
    <!-- MODAL DE CONFIRMAÇÃO                        -->

    <div id="confirmModal" class="modal-overlay" style="display: none">
      <div class="modal-confirm">

          Tem certeza que deseja continuar?

          </button>

    <!-- ============================================ -->
    <!-- SUPABASE SDK                                -->
    <!-- ============================================ -->
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
        }
      }
    </script>

    <script type="module">
      import { createClient } from "@supabase/supabase-js";

      // ============================================
      // CONFIG SUPABASE
      // ============================================
      const SUPABASE_URL = "https://qgkjnzcqjhhqdgxmvtew.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_gbXPIpkbYvf3YKITplkjpg_eKrPHhYw";
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // ============================================
      // ESTADO GLOBAL
      // ============================================
      let usuarioAtual = null;
      let usuarios = [];
      let modulosSistema = [];
      let permissoesUsuarios = []; // [{ usuario_id, modulo, permitido }]
      let filtros = {
        busca: "",
        status: "todos",
        perfil: "",
      };
      let paginaAtual = 1;
      const itensPorPagina = 10;
      let usuarioEditando = null; // usuário sendo editado no modal
      let selecionadosNoModal = new Set(); // módulos marcados no modal

      // ============================================
      // UTILITÁRIOS
      // ============================================
      function escaparHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function iniciais(nome) {
        if (!nome) return "?";
        const p = nome.trim().split(/\s+/);
        if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
        return (p[0][0] + p[p.length - 1][0]).toUpperCase();
      }

      function mostrarToast(tipo, titulo, mensagem, duracao = 4000) {
        const container = document.getElementById("toastContainer");
        const icones = {
          sucesso: "✅",
          erro: "❌",
          aviso: "⚠️",
          info: "ℹ️",
        };

        const toast = document.createElement("div");
        toast.className = `toast ${tipo}`;
        toast.innerHTML = `
                <i>${icones[tipo] || "ℹ️"}</i>
                <span class="msg"><strong>${escaparHtml(titulo)}</strong><br>${escaparHtml(mensagem)}</span>
                <button class="btn-fechar" onclick="this.parentElement.remove()">✕</button>
            `;

        container.appendChild(toast);

        if (duracao > 0) {
          setTimeout(() => {
            if (toast.parentElement) {
              toast.style.opacity = "0";
              toast.style.transform = "translateX(20px)";
              toast.style.transition = "all 0.3s";
              setTimeout(() => toast.remove(), 300);
            }
          }, duracao);
        }
      }

      function mostrarLoading(show) {
        const container = document.getElementById("loadingContainer");
        if (container) {
          container.style.display = show ? "flex" : "none";
        }
        const content = document.querySelector(".permissoes-content");
        if (content) {
          content.style.display = show ? "none" : "block";
        }
      }

      function labelPerfil(p) {
        const map = {
          ADMIN: "Administrador",
          SECRETARIO: "Secretário",
          SOLICITANTE: "Solicitante",
          ESTAGIARIO: "Estagiário",
        };
        return map[p] || p || "—";
      }

      function classePerfilBadge(p) {
        const map = {
          ADMIN: "admin",
          SECRETARIO: "secretario",
          SOLICITANTE: "solicitante",
          ESTAGIARIO: "estagiario",
        };
        return map[p] || "solicitante";
      }

      // ============================================
      // SIDEBAR TOGGLE
      // ============================================
      window.toggleSidebar = function () {
        const sidebar = document.getElementById("coreSidebar");
        sidebar.classList.toggle("open");
      };

      // ============================================
      // AUTENTICAÇÃO
      // ============================================
      async function verificarAutenticacao() {
        try {
          const {
            data: { session },
          } = await supabase.auth.getSession();
          if (!session) {
            window.location.href = "../../index.html";
            return false;
          }

          const { data: perfil, error } = await supabase
            .from("usuarios")
            .select("id, uuid, nome, email, perfil, ativo")
            .eq("uuid", session.user.id)
            .maybeSingle();

          if (error || !perfil || perfil.ativo === false) {
            window.location.href = "../../intranet.html";
            return false;
          }

          if (perfil.perfil !== "ADMIN") {
            mostrarToast(
              "erro",
              "Acesso negado",
              "Apenas administradores podem acessar esta área.",
            );
            setTimeout(() => {
              window.location.href = "../../intranet.html";
            }, 2000);
            return false;
          }

          usuarioAtual = perfil;
          return true;
        } catch (error) {
          console.error("Erro ao verificar autenticação:", error);
          window.location.href = "../../index.html";
          return false;
        }
      }

      function atualizarInterfaceUsuario() {
        if (!usuarioAtual) return;

        const userName = document.getElementById("userName");
        const userPerfil = document.getElementById("userPerfil");
        const userAvatar = document.getElementById("userAvatar");

        if (userName) userName.textContent = usuarioAtual.nome || "Usuário";
        if (userPerfil) userPerfil.textContent = usuarioAtual.perfil || "ADMIN";
        if (userAvatar && usuarioAtual.nome) {
          userAvatar.textContent = iniciais(usuarioAtual.nome);
        }
      }

      // ============================================
      // CARREGAR DADOS
      // ============================================
      async function carregarDados() {
        try {
          mostrarLoading(true);

          // 1. Usuários (com órgão)
          const { data: usuariosData, error: errU } = await supabase
            .from("usuarios")
            .select(
              "id, uuid, nome, email, perfil, ativo, orgao_id, orgao:orgaos(id, nome, sigla)",
            )
            .order("nome", { ascending: true });

          if (errU) throw errU;
          usuarios = usuariosData || [];

          // 2. Módulos ativos e visíveis
          const { data: modulosData, error: errM } = await supabase
            .from("modulos_sistema")
            .select(
              "id, nome, descricao, icone, rota, ordem, cor, ativo, visivel_intranet",
            )
            .eq("ativo", true)
            .eq("visivel_intranet", true)
            .order("ordem", { ascending: true });

          if (errM) throw errM;
          modulosSistema = modulosData || [];

          // 3. Permissões individuais já concedidas
          const { data: permissoesData, error: errP } = await supabase
            .from("usuarios_modulos")
            .select("usuario_id, modulo, permitido");

          if (errP) throw errP;
          permissoesUsuarios = permissoesData || [];

          renderizar();
        } catch (error) {
          console.error("Erro ao carregar dados:", error);
          mostrarToast(
            "erro",
            "Erro",
            error.message || "Não foi possível carregar os dados.",
          );
        } finally {
          mostrarLoading(false);
        }
      }

      // ============================================
      // MAPA AUXILIAR · permissões por usuário
      // ============================================
      function construirMapaPermissoes() {
        const mapa = {};
        permissoesUsuarios.forEach((p) => {
          if (!mapa[p.usuario_id]) mapa[p.usuario_id] = new Set();
          if (p.permitido) mapa[p.usuario_id].add(p.modulo);
        });
        return mapa;
      }

      // ============================================
      // RENDERIZAR PÁGINA
      // ============================================
      function renderizar() {
        const container = document.getElementById("pageContent");
        if (!container) return;

        // Filtra usuários
        let usuariosFiltrados = [...usuarios];

        if (filtros.busca) {
          const termo = filtros.busca.toLowerCase();
          usuariosFiltrados = usuariosFiltrados.filter((u) => {
            const alvo = [u.nome, u.email, u.perfil]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();
            return alvo.includes(termo);
          });
        }

        if (filtros.status === "ativo") {
          usuariosFiltrados = usuariosFiltrados.filter(
            (u) => u.ativo !== false,
          );
        } else if (filtros.status === "inativo") {
          usuariosFiltrados = usuariosFiltrados.filter(
            (u) => u.ativo === false,
          );
        }

        if (filtros.perfil) {
          usuariosFiltrados = usuariosFiltrados.filter(
            (u) => u.perfil === filtros.perfil,
          );
        }

        const totalPaginas =
          Math.ceil(usuariosFiltrados.length / itensPorPagina) || 1;
        if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;

        const inicio = (paginaAtual - 1) * itensPorPagina;
        const paginaUsuarios = usuariosFiltrados.slice(
          inicio,
          inicio + itensPorPagina,
        );

        const mapaPermissoes = construirMapaPermissoes();
        const totalModulos = modulosSistema.length;

        // Contadores do rodapé
        const totalAtivos = usuarios.filter((u) => u.ativo !== false).length;
        const totalInativos = usuarios.filter((u) => u.ativo === false).length;

        container.innerHTML = `
                <div class="permissoes-content">
                    <div class="page-header">
                        <div>
                            <h1><i class="fas fa-key"></i> Gestão de Permissões</h1>
                            <p>
                                Selecione um usuário e defina quais módulos ele pode acessar.
                                Usuários com perfil <strong>ADMIN</strong> têm acesso total por padrão.
                            </p>
                        </div>
                    </div>

                    <div class="filters-bar">
                        <div class="filter-group" style="flex: 1;">
                            <label><i class="fas fa-search"></i> Buscar</label>
                            <input type="text" id="filtroBusca" placeholder="Nome, e-mail ou perfil..." value="${escaparHtml(filtros.busca)}" />
                        </div>
                        <div class="filter-group">
                            <label><i class="fas fa-user-tag"></i> Perfil</label>
                            <select id="filtroPerfil">
                                <option value="">Todos</option>
                                <option value="ADMIN" ${filtros.perfil === "ADMIN" ? "selected" : ""}>Administrador</option>
                                <option value="SECRETARIO" ${filtros.perfil === "SECRETARIO" ? "selected" : ""}>Secretário</option>
                                <option value="SOLICITANTE" ${filtros.perfil === "SOLICITANTE" ? "selected" : ""}>Solicitante</option>
                                <option value="ESTAGIARIO" ${filtros.perfil === "ESTAGIARIO" ? "selected" : ""}>Estagiário</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><i class="fas fa-filter"></i> Status</label>
                            <select id="filtroStatus">
                                <option value="todos" ${filtros.status === "todos" ? "selected" : ""}>Todos</option>
                                <option value="ativo" ${filtros.status === "ativo" ? "selected" : ""}>Ativos</option>
                                <option value="inativo" ${filtros.status === "inativo" ? "selected" : ""}>Inativos</option>
                            </select>
                        </div>
                        <button class="btn btn-secondary" id="btnLimparFiltros">
                            <i class="fas fa-undo-alt"></i> Limpar
                        </button>
                        <button class="btn btn-primary" id="btnAplicarFiltros">
                            <i class="fas fa-search"></i> Aplicar
                        </button>
                    </div>

                    <div class="card">
                        <div class="table-container">
                            ${renderizarTabela(paginaUsuarios, mapaPermissoes, totalModulos)}
                        </div>
                        ${
                          usuariosFiltrados.length > itensPorPagina
                            ? `
                            <div class="pagination">
                                <button class="btn-page" id="btnPagAnterior" ${paginaAtual <= 1 ? "disabled" : ""}>
                                    <i class="fas fa-chevron-left"></i> Anterior
                                </button>
                                <span class="page-info">Página ${paginaAtual} de ${totalPaginas}</span>
                                <button class="btn-page" id="btnPagProximo" ${paginaAtual >= totalPaginas ? "disabled" : ""}>
                                    Próximo <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                        `
                            : ""
                        }
                    </div>

                    <div class="stats-footer">
                        <span><i class="fas fa-users"></i> Total: <strong>${usuarios.length}</strong> usuários</span>
                        <span><i class="fas fa-check-circle" style="color: var(--success-600);"></i> Ativos: <strong>${totalAtivos}</strong></span>
                        <span><i class="fas fa-times-circle" style="color: var(--error-600);"></i> Inativos: <strong>${totalInativos}</strong></span>
                        <span><i class="fas fa-cubes"></i> Módulos disponíveis: <strong>${totalModulos}</strong></span>
                    </div>
                </div>
            `;

        configurarEventosPagina();
      }

      // ============================================
      // RENDERIZAR TABELA
      // ============================================
      function renderizarTabela(lista, mapaPermissoes, totalModulos) {
        if (!lista || lista.length === 0) {
          return `
                    <div class="empty-state">
                        <span class="empty-icon"><i class="fas fa-users"></i></span>
                        <p>Nenhum usuário encontrado.</p>
                    </div>
                `;
        }

        return `
                <table class="table">
                    <thead>
                        <tr>
                            <th style="width: 40px;">#</th>
                            <th>Usuário</th>
                            <th>Perfil</th>
                            <th>Órgão</th>
                            <th>Módulos</th>
                            <th>Status</th>
                            <th style="min-width: 140px;">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${lista
                          .map((u, index) => {
                            const num =
                              (paginaAtual - 1) * itensPorPagina + index + 1;
                            const isAdmin = u.perfil === "ADMIN";
                            const setModulos =
                              mapaPermissoes[u.id] || new Set();
                            const qtd = isAdmin
                              ? totalModulos
                              : setModulos.size;

                            // Classes do badge de módulos
                            let classeBadge = "negado";
                            if (
                              isAdmin ||
                              (totalModulos > 0 && qtd === totalModulos)
                            ) {
                              classeBadge = "admin";
                            } else if (qtd > 0) {
                              classeBadge = "permitido";
                            }

                            const perfilClasse = classePerfilBadge(u.perfil);
                            const statusClasse =
                              u.ativo !== false
                                ? "status-ativo"
                                : "status-inativo";

                            return `
                                    <tr>
                                        <td style="text-align: center; color: var(--neutral-500);">${num}</td>
                                        <td>
                                            <div class="usuario-cell">
                                                <div class="avatar-mini">${escaparHtml(iniciais(u.nome))}</div>
                                                <div class="usuario-info">
                                                    <strong>${escaparHtml(u.nome || "—")}</strong>
                                                    <span>${escaparHtml(u.email || "")}</span>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <span class="badge-perfil-sistema ${perfilClasse}">
                                                ${escaparHtml(labelPerfil(u.perfil))}
                                            </span>
                                        </td>
                                        <td style="font-size:0.82rem;color:var(--neutral-600);">
                                            ${escaparHtml(u.orgao?.sigla || u.orgao?.nome || "—")}
                                        </td>
                                        <td>
                                            <span class="badge-permissao ${classeBadge}">
                                                ${isAdmin ? "Acesso total" : `${qtd}/${totalModulos} módulos`}
                                            </span>
                                        </td>
                                        <td>
                                            <span class="status-badge ${statusClasse}">
                                                ${u.ativo !== false ? "Ativo" : "Inativo"}
                                            </span>
                                        </td>
                                        <td class="acoes-cell">
                                            ${
                                              isAdmin
                                                ? `<button class="btn btn-sm btn-secondary" disabled title="ADMIN tem acesso total por padrão">
                                                        <i class="fas fa-shield-halved"></i> Admin
                                                       </button>`
                                                : `<button class="btn btn-sm btn-primary" data-acao="modulos" data-id="${u.id}" title="Gerenciar módulos">
                                                        <i class="fas fa-cubes"></i> Módulos
                                                       </button>`
                                            }
                                        </td>
                                    </tr>
                                `;
                          })
                          .join("")}
                    </tbody>
                </table>
            `;
      }

      // ============================================
      // CONFIGURAR EVENTOS DA PÁGINA
      // ============================================
      function configurarEventosPagina() {
        document
          .getElementById("btnAplicarFiltros")
          ?.addEventListener("click", aplicarFiltros);
        document
          .getElementById("btnLimparFiltros")
          ?.addEventListener("click", limparFiltros);

        document
          .getElementById("filtroStatus")
          ?.addEventListener("change", aplicarFiltros);
        document
          .getElementById("filtroPerfil")
          ?.addEventListener("change", aplicarFiltros);

        document
          .getElementById("filtroBusca")
          ?.addEventListener("keypress", (e) => {
            if (e.key === "Enter") aplicarFiltros();
          });

        document
          .getElementById("btnPagAnterior")
          ?.addEventListener("click", () => {
            if (paginaAtual > 1) {
              paginaAtual--;
              renderizar();
            }
          });

        document
          .getElementById("btnPagProximo")
          ?.addEventListener("click", () => {
            const filtrados = usuarios.filter((u) => {
              if (filtros.status === "ativo" && u.ativo === false) return false;
              if (filtros.status === "inativo" && u.ativo !== false)
                return false;
              if (filtros.perfil && u.perfil !== filtros.perfil) return false;
              if (filtros.busca) {
                const t = filtros.busca.toLowerCase();
                const alvo = [u.nome, u.email, u.perfil]
                  .filter(Boolean)
                  .join(" ")
                  .toLowerCase();
                if (!alvo.includes(t)) return false;
              }
              return true;
            });
            const totalPaginas =
              Math.ceil(filtrados.length / itensPorPagina) || 1;
            if (paginaAtual < totalPaginas) {
              paginaAtual++;
              renderizar();
            }
          });

        // Botões "Módulos" nas linhas da tabela
        document.querySelectorAll("[data-acao='modulos']").forEach((btn) => {
          btn.addEventListener("click", () => {
            abrirModalModulos(parseInt(btn.dataset.id));
          });
        });
      }

      // ============================================
      // FILTROS
      // ============================================
      function aplicarFiltros() {
        filtros.busca = document.getElementById("filtroBusca")?.value || "";
        filtros.status =
          document.getElementById("filtroStatus")?.value || "todos";
        filtros.perfil = document.getElementById("filtroPerfil")?.value || "";
        paginaAtual = 1;
        renderizar();
      }

      function limparFiltros() {
        filtros = { busca: "", status: "todos", perfil: "" };
        paginaAtual = 1;
        renderizar();
      }

      // ============================================
      // MODAL · GERENCIAR MÓDULOS DO USUÁRIO
      // ============================================
      function abrirModalModulos(usuarioId) {
        usuarioEditando = usuarios.find((u) => u.id === usuarioId);
        if (!usuarioEditando) return;

        // Pré-popula o Set com os módulos já permitidos
        selecionadosNoModal = new Set();
        permissoesUsuarios.forEach((p) => {
          if (p.usuario_id === usuarioId && p.permitido) {
            selecionadosNoModal.add(p.modulo);
          }
        });

        const modal = document.createElement("div");
        modal.className = "modal-overlay";
        modal.id = "modalModulos";
        modal.innerHTML = `
                <div class="modal-container modal-md">
                    <div class="modal-header">
                        <h2><i class="fas fa-cubes"></i> Módulos permitidos</h2>
                        <button class="modal-close" id="btnFecharModal" title="Fechar">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="modal-user-header">
                            <div class="avatar-lg">${escaparHtml(iniciais(usuarioEditando.nome))}</div>
                            <div class="info">
                                <strong>${escaparHtml(usuarioEditando.nome || "—")}</strong>
                                <span>
                                    ${escaparHtml(usuarioEditando.email || "")}
                                    · ${escaparHtml(labelPerfil(usuarioEditando.perfil))}
                                    ${usuarioEditando.orgao?.sigla ? " · " + escaparHtml(usuarioEditando.orgao.sigla) : ""}
                                </span>
                            </div>
                        </div>

                        <div class="form-hint">
                            <i class="fas fa-circle-info"></i>
                            <div>
                                Marque os módulos que <strong>${escaparHtml(usuarioEditando.nome || "este usuário")}</strong>
                                pode acessar. As alterações só têm efeito após clicar em
                                <strong>Salvar</strong>.
                            </div>
                        </div>

                        ${
                          modulosSistema.length === 0
                            ? `
                            <div class="empty-state">
                                <span class="empty-icon"><i class="fas fa-cubes"></i></span>
                                <p>Nenhum módulo cadastrado ainda.</p>
                            </div>
                            `
                            : `
                            <div class="modulos-controles">
                                <div class="info">
                                    <strong id="contadorSelecionados">${selecionadosNoModal.size}</strong>
                                    de <strong>${modulosSistema.length}</strong> módulo(s) selecionado(s)
                                </div>
                                <div class="botoes">
                                    <button class="btn btn-sm btn-secondary" id="btnMarcarTodos">
                                        <i class="fas fa-check-double"></i> Marcar todos
                                    </button>
                                    <button class="btn btn-sm btn-secondary" id="btnDesmarcarTodos">
                                        <i class="fas fa-xmark"></i> Desmarcar todos
                                    </button>
                                </div>
                            </div>

                            <div class="modulos-grid" id="modulosGrid">
                                ${modulosSistema
                                  .map((m) => {
                                    const marcado = selecionadosNoModal.has(
                                      m.nome,
                                    );
                                    return `
                                        <div class="modulo-item ${marcado ? "ativo" : ""}" data-modulo="${escaparHtml(m.nome)}">
                                            <input type="checkbox"
                                                   id="mod_${escaparHtml(m.nome)}"
                                                   data-modulo="${escaparHtml(m.nome)}"
                                                   ${marcado ? "checked" : ""} />
                                            <label for="mod_${escaparHtml(m.nome)}">
                                                <i class="fas ${escaparHtml(m.icone || "fa-cube")}"></i>
                                                ${escaparHtml(m.descricao || m.nome)}
                                            </label>
                                        </div>
                                        `;
                                  })
                                  .join("")}
                            </div>
                            `
                        }
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" id="btnCancelarModulos">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button class="btn btn-primary" id="btnSalvarModulos" ${modulosSistema.length === 0 ? "disabled" : ""}>
                            <i class="fas fa-save"></i> Salvar permissões
                        </button>
                    </div>
                </div>
            `;

        document.body.appendChild(modal);

        // Eventos do modal
        document
          .getElementById("btnFecharModal")
          .addEventListener("click", fecharModalModulos);
        document
          .getElementById("btnCancelarModulos")
          .addEventListener("click", fecharModalModulos);
        document
          .getElementById("btnSalvarModulos")
          .addEventListener("click", salvarModulos);

        document
          .getElementById("btnMarcarTodos")
          ?.addEventListener("click", () => {
            selecionadosNoModal = new Set(modulosSistema.map((m) => m.nome));
            atualizarModalUI();
          });

        document
          .getElementById("btnDesmarcarTodos")
          ?.addEventListener("click", () => {
            selecionadosNoModal.clear();
            atualizarModalUI();
          });

        // Checkboxes individuais
        document
          .querySelectorAll("#modulosGrid input[type='checkbox']")
          .forEach((cb) => {
            cb.addEventListener("change", () => {
              const nome = cb.dataset.modulo;
              if (cb.checked) selecionadosNoModal.add(nome);
              else selecionadosNoModal.delete(nome);
              atualizarModalUI();
            });
          });

        // Clique no overlay fecha
        modal.addEventListener("click", (e) => {
          if (e.target === modal) fecharModalModulos();
        });
      }

      function atualizarModalUI() {
        const contador = document.getElementById("contadorSelecionados");
        if (contador) contador.textContent = selecionadosNoModal.size;

        document.querySelectorAll("#modulosGrid .modulo-item").forEach((el) => {
          const nome = el.dataset.modulo;
          const cb = el.querySelector("input[type='checkbox']");
          const marcado = selecionadosNoModal.has(nome);
          if (cb) cb.checked = marcado;
          el.classList.toggle("ativo", marcado);
        });
      }

      function fecharModalModulos() {
        const modal = document.getElementById("modalModulos");
        if (modal) modal.remove();
        usuarioEditando = null;
        selecionadosNoModal.clear();
      }

      // ============================================
      // SALVAR PERMISSÕES
      // ============================================
      async function salvarModulos() {
        if (!usuarioEditando) return;

        const btn = document.getElementById("btnSalvarModulos");
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Salvando...`;

        try {
          const usuarioId = usuarioEditando.id;
          const agora = new Date().toISOString();

          // 1. Apaga as permissões atuais deste usuário
          const { error: errDel } = await supabase
            .from("usuarios_modulos")
            .delete()
            .eq("usuario_id", usuarioId);
          if (errDel) throw errDel;

          // 2. Insere as novas (só as permitidas)
          const modulosArray = Array.from(selecionadosNoModal);
          if (modulosArray.length > 0) {
            const registros = modulosArray.map((nome) => ({
              usuario_id: usuarioId,
              modulo: nome,
              permitido: true,
              concedido_por: usuarioAtual.id,
              concedido_em: agora,
              updated_at: agora,
            }));

            const { error: errIns } = await supabase
              .from("usuarios_modulos")
              .insert(registros);
            if (errIns) throw errIns;
          }

          mostrarToast(
            "sucesso",
            "Permissões salvas",
            `${modulosArray.length} módulo(s) liberado(s) para ${usuarioEditando.nome}.`,
          );

          fecharModalModulos();
          await carregarDados();
        } catch (error) {
          console.error("Erro ao salvar permissões:", error);
          mostrarToast(
            "erro",
            "Erro ao salvar",
            error.message || "Não foi possível salvar as permissões.",
          );
          btn.disabled = false;
          btn.innerHTML = `<i class="fas fa-save"></i> Salvar permissões`;
        }
      }

      // ============================================
      // MODAL DE CONFIRMAÇÃO
      // ============================================
      function showConfirm(title, message, icon = "⚠️") {
        return new Promise((resolve) => {
          const modal = document.getElementById("confirmModal");
          const confirmIcon = document.getElementById("confirmIcon");
          const confirmTitle = document.getElementById("confirmTitle");
          const confirmMessage = document.getElementById("confirmMessage");
          const confirmOkBtn = document.getElementById("confirmOkBtn");
          const confirmCancelBtn = document.getElementById("confirmCancelBtn");

          if (!modal) {
            resolve(window.confirm(`${title}\n\n${message}`));
            return;
          }

          confirmIcon.textContent = icon;
          confirmTitle.textContent = title;
          confirmMessage.textContent = message;

          modal.style.display = "flex";

          function cleanup() {
            modal.style.display = "none";
            confirmOkBtn.removeEventListener("click", handleConfirm);
            confirmCancelBtn.removeEventListener("click", handleCancel);
            modal.removeEventListener("click", handleClickOutside);
          }

          function handleConfirm() {
            cleanup();
            resolve(true);
          }

          function handleCancel() {
            cleanup();
            resolve(false);
          }

          function handleClickOutside(e) {
            if (e.target === modal) {
              cleanup();
              resolve(false);
            }
          }

          confirmOkBtn.addEventListener("click", handleConfirm);
          confirmCancelBtn.addEventListener("click", handleCancel);
          modal.addEventListener("click", handleClickOutside);
        });
      }

      // ============================================
      // LOGOUT
      // ============================================
      document
        .getElementById("btnLogout")
        .addEventListener("click", async () => {
          const ok = await showConfirm(
            "Sair do sistema",
            "Tem certeza que deseja sair?",
            "🔓",
          );
          if (ok) {
            await supabase.auth.signOut();
            window.location.href = "../../index.html";
          }
        });

      // ============================================
      // EVENTOS GLOBAIS
      // ============================================
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const modal = document.getElementById("modalModulos");
          if (modal) fecharModalModulos();
        }
      });

      // ============================================
      // INICIALIZAÇÃO
      // ============================================
      async function init() {
        const autenticado = await verificarAutenticacao();
        if (!autenticado) return;

        atualizarInterfaceUsuario();
        await carregarDados();
      }

      init();
    </script>
  </body>
</html>
