<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Administrativo · Core</title>

    <!-- Font Awesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <style>
      /* =====================================================================
         DESIGN SYSTEM · VARIÁVEIS GLOBAIS (padrão Biblioteca)
         ===================================================================== */
      :root {
        /* --- CORES INSTITUCIONAIS --- */
        --verde: #0d5e3a;
        --verde-escuro: #0a4a2e;
        --verde-claro: #e8f5e9;
        --verde-suave: #f0fdf4;

        --azul: #1a3a6b;
        --azul-claro: #ebf4ff;

        --cinza-texto: #475569;
        --cinza-suave: #f1f5f9;
        --cinza-borda: #e2e8f0;

        --vermelho: #e53e3e;
        --vermelho-suave: #fff5f5;

        --amarelo: #d69e2e;
        --amarelo-suave: #fffff0;

        --roxo: #8b5cf6;
        --roxo-suave: #f3f0ff;

        --branco: #ffffff;

        /* --- ALIASES DE COMPATIBILIDADE (mantém JS atual funcionando) --- */
        --primary-50: #ecfdf5;
        --primary-100: #d1fae5;
        --primary-200: #a7f3d0;
        --primary-300: #6ee7b7;
        --primary-400: #34d399;
        --primary-500: #10b981;
        --primary-600: #0d5e3a;
        --primary-700: #1a3a6b;
        --primary-800: #064e3b;
        --primary-900: #022c22;

        --success-50: #ecfdf5;
        --success-100: #d1fae5;
        --success-200: #a7f3d0;
        --success-300: #6ee7b7;
        --success-400: #34d399;
        --success-500: #10b981;
        --success-600: #059669;
        --success-700: #047857;
        --success-800: #065f46;

        --warning-50: #fffbeb;
        --warning-100: #fef3c7;
        --warning-200: #fde68a;
        --warning-300: #fcd34d;
        --warning-400: #fbbf24;
        --warning-500: #f59e0b;
        --warning-600: #d97706;
        --warning-700: #b45309;
        --warning-800: #92400e;

        --error-50: #fef2f2;
        --error-100: #fee2e2;
        --error-200: #fecaca;
        --error-300: #fca5a5;
        --error-400: #f87171;
        --error-500: #ef4444;
        --error-600: #dc2626;
        --error-700: #b91c1c;
        --error-800: #991b1b;

        --neutral-50: #f8fafc;
        --neutral-100: #f1f5f9;
        --neutral-200: #e2e8f0;
        --neutral-300: #cbd5e1;
        --neutral-400: #94a3b8;
        --neutral-500: #64748b;
        --neutral-600: #475569;
        --neutral-700: #334155;
        --neutral-800: #1e293b;
        --neutral-900: #0f172a;

        /* --- SOMBRAS --- */
        --sombra-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        --sombra-card-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.08);
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md:
          0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg:
          0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-xl:
          0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        --transition-base: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* =====================================================================
         RESET E BASE
         ===================================================================== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
      }

      body {
        background: linear-gradient(145deg, #e8f5e9 0%, #e2eaf1 100%);
        color: var(--cinza-texto);
        min-height: 100vh;
        line-height: 1.5;
        font-size: 14px;
      }

      /* =====================================================================
         LAYOUT · SIDEBAR + MAIN (grid 260px 1fr — padrão Biblioteca)
         ===================================================================== */
      .app-layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
      }

      /* ---------- SIDEBAR (verde institucional) ---------- */
      .sidebar {
        background: linear-gradient(180deg, #0d5e3a 0%, #0a4a2e 100%);
        color: white;
        padding: 1.8rem 1.2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }

      .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0.5rem 0.6rem 1.2rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      }

      .sidebar-brand .brand-icon {
        width: 44px;
        height: 44px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        flex-shrink: 0;
      }

      .sidebar-brand .brand-text h2 {
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.2;
      }

      .sidebar-brand .brand-text span {
        font-size: 0.7rem;
        opacity: 0.8;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }

      .sidebar-nav .nav-section {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.55;
        padding: 0.8rem 0.6rem 0.4rem;
        font-weight: 700;
      }

      .sidebar-nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0.7rem 0.9rem;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-size: 0.88rem;
        font-weight: 500;
        transition: all 0.2s;
        opacity: 0.9;
      }

      .sidebar-nav a i {
        width: 20px;
        text-align: center;
        font-size: 1rem;
        opacity: 0.85;
      }

      .sidebar-nav a:hover {
        background: rgba(255, 255, 255, 0.1);
        opacity: 1;
        transform: translateX(2px);
      }

      .sidebar-nav a.active {
        background: rgba(255, 255, 255, 0.18);
        opacity: 1;
        font-weight: 600;
        border-left: 3px solid #c6f6d5;
      }

      .sidebar-voltar {
        padding-top: 1rem;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
      }

      .sidebar-voltar a {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.85);
        text-decoration: none;
        font-size: 0.82rem;
        padding: 0.6rem;
        border-radius: 8px;
        transition: all 0.2s;
      }

      .sidebar-voltar a:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }

      /* ---------- ÁREA PRINCIPAL ---------- */
      .main-area {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ---------- TOPBAR (clara, sticky, backdrop-blur) ---------- */
      .topbar {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--cinza-borda);
        padding: 1.1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 50;
      }

      .topbar-titulo h1 {
        font-size: 1.4rem;
        font-weight: 700;
        color: #0f172a;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .topbar-titulo h1 i {
        color: var(--verde);
      }

      .topbar-titulo p {
        font-size: 0.8rem;
        color: #718096;
        margin-top: 2px;
      }

      .topbar-direita {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .topbar-info {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        font-size: 0.78rem;
        color: #718096;
      }

      .topbar-info strong {
        color: #0f172a;
        font-size: 0.85rem;
      }

      .avatar-usuario {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--verde), var(--azul));
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.95rem;
        border: 2px solid white;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
      }

      .btn-sair {
        background: transparent;
        border: 1px solid var(--cinza-borda);
        color: var(--cinza-texto);
        padding: 0.5rem 0.9rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
        font-family: inherit;
      }

      .btn-sair:hover {
        background: var(--vermelho-suave);
        color: var(--vermelho);
        border-color: var(--vermelho);
      }

      /* ---------- BOTÃO TOGGLE SIDEBAR (mobile) ---------- */
      .btn-toggle-sidebar {
        display: none;
        background: transparent;
        border: 1px solid var(--cinza-borda);
        color: var(--cinza-texto);
        width: 40px;
        height: 40px;
        border-radius: 10px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        transition: all 0.2s;
      }

      .btn-toggle-sidebar:hover {
        background: var(--cinza-suave);
      }

      /* =====================================================================
         CONTEÚDO
         ===================================================================== */
      .conteudo {
        padding: 2rem;
        flex: 1;
        max-width: 1400px;
        width: 100%;
        margin: 0 auto;
      }

      /* =====================================================================
         PAGE HEADER
         ===================================================================== */
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 16px;
      }

      .page-header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--neutral-900);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .page-header h1 i {
        color: var(--verde);
      }

      .page-header .subtitle {
        font-size: 0.9rem;
        color: var(--neutral-500);
        font-weight: 400;
        display: block;
        margin-top: 4px;
      }

      /* =====================================================================
         BOTÕES (padrão Biblioteca)
         ===================================================================== */
      .btn {
        padding: 0.75rem 1.2rem;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.88rem;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: inherit;
        text-decoration: none;
        white-space: nowrap;
      }

      .btn-primary {
        background: var(--verde);
        color: white;
      }

      .btn-primary:hover {
        background: var(--verde-escuro);
        transform: translateY(-1px);
      }

      .btn-primary:disabled {
        background: #94a3b8;
        cursor: not-allowed;
        transform: none;
      }

      .btn-secondary {
        background: var(--cinza-suave);
        color: var(--cinza-texto);
        border: 1px solid var(--cinza-borda);
      }

      .btn-secondary:hover {
        background: var(--cinza-borda);
      }

      .btn-success {
        background: var(--success-600);
        color: white;
      }

      .btn-success:hover {
        background: var(--success-700);
        transform: translateY(-1px);
      }

      .btn-danger {
        background: var(--vermelho);
        color: white;
      }

      .btn-danger:hover {
        background: #c53030;
        transform: translateY(-1px);
      }

      .btn-outline {
        background: white;
        border: 2px solid var(--verde);
        color: var(--verde);
      }

      .btn-outline:hover {
        background: var(--verde-suave);
      }

      .btn-sm {
        padding: 0.5rem 0.9rem;
        font-size: 0.8rem;
        border-radius: 10px;
      }

      /* =====================================================================
         STATS CARDS
         ===================================================================== */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 32px;
      }

      .stat-card {
        background: white;
        border-radius: 18px;
        padding: 24px;
        box-shadow: var(--sombra-card);
        border: 1px solid var(--cinza-borda);
        transition: all 0.25s;
        position: relative;
        overflow: hidden;
      }

      .stat-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--sombra-card-hover);
      }

      .stat-card .stat-icon {
        font-size: 2rem;
        margin-bottom: 12px;
        display: inline-block;
      }

      .stat-card .stat-value {
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--neutral-900);
        display: block;
        line-height: 1.2;
      }

      .stat-card .stat-label {
        font-size: 0.85rem;
        color: var(--neutral-500);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 4px;
      }

      .stat-card .stat-change {
        font-size: 0.8rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 12px;
        border-radius: 40px;
        margin-top: 8px;
      }

      .stat-change.up {
        background: var(--success-50);
        color: var(--success-700);
      }

      .stat-change.down {
        background: var(--error-50);
        color: var(--error-700);
      }

      .stat-change.neutral {
        background: var(--cinza-suave);
        color: var(--neutral-600);
      }

      .stat-card .stat-footer {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--cinza-borda);
        font-size: 0.8rem;
        color: var(--neutral-500);
      }

      .stat-card .stat-footer a {
        color: var(--verde);
        text-decoration: none;
        font-weight: 600;
      }

      .stat-card .stat-footer a:hover {
        text-decoration: underline;
      }

      /* Cores específicas por tipo */
      .stat-card.stat-verde .stat-icon {
        color: var(--success-600);
      }
      .stat-card.stat-verde .stat-value {
        color: var(--success-700);
      }

      .stat-card.stat-azul .stat-icon {
        color: var(--verde);
      }
      .stat-card.stat-azul .stat-value {
        color: var(--azul);
      }

      .stat-card.stat-vermelho .stat-icon {
        color: var(--error-600);
      }
      .stat-card.stat-vermelho .stat-value {
        color: var(--error-700);
      }

      .stat-card.stat-amarelo .stat-icon {
        color: var(--warning-600);
      }
      .stat-card.stat-amarelo .stat-value {
        color: var(--warning-700);
      }

      /* =====================================================================
         QUICK ACCESS CARDS
         ===================================================================== */
      .quick-access-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 32px;
      }

      .quick-card {
        background: white;
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.25s;
        border: 2px solid transparent;
        box-shadow: var(--sombra-card);
      }

      .quick-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--sombra-card-hover);
        border-color: var(--verde);
      }

      .quick-card .quick-icon {
        font-size: 2.2rem;
        color: var(--verde);
        margin-bottom: 12px;
      }

      .quick-card .quick-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--neutral-900);
      }

      .quick-card .quick-desc {
        font-size: 0.8rem;
        color: var(--neutral-500);
        margin-top: 4px;
      }

      .quick-card .quick-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 600;
        margin-top: 8px;
      }

      .quick-card .quick-badge.badge-count {
        background: var(--verde-suave);
        color: var(--verde);
        border: 1px solid #c6f6d5;
      }

      /* =====================================================================
         SECTION CARDS
         ===================================================================== */
      .section-card {
        background: white;
        border-radius: 18px;
        box-shadow: var(--sombra-card);
        border: 1px solid var(--cinza-borda);
        overflow: hidden;
        margin-bottom: 24px;
      }

      .section-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--cinza-borda);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
        flex-wrap: wrap;
        gap: 12px;
      }

      .section-header h3 {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--neutral-900);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section-header h3 i {
        color: var(--verde);
      }

      .section-header .btn-link {
        color: var(--verde);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .section-header .btn-link:hover {
        text-decoration: underline;
      }

      .section-body {
        padding: 20px 24px;
      }

      /* =====================================================================
         TABELA
         ===================================================================== */
      .table-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .table th {
        background: #f8fafc;
        padding: 12px 16px;
        text-align: left;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--neutral-500);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 2px solid var(--cinza-borda);
      }

      .table td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--cinza-borda);
        color: var(--neutral-700);
        vertical-align: middle;
      }

      .table tbody tr:hover td {
        background: #f8fafc;
      }

      .table tbody tr:last-child td {
        border-bottom: none;
      }

      .table .status-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 40px;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .table .status-ativo {
        background: var(--success-100);
        color: var(--success-800);
        border: 1px solid #c6f6d5;
      }

      .table .status-inativo {
        background: var(--error-100);
        color: var(--error-800);
        border: 1px solid #fed7d7;
      }

      .table .badge-perfil {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 40px;
        font-size: 0.7rem;
        font-weight: 600;
      }

      .badge-perfil.admin {
        background: linear-gradient(135deg, var(--error-100), var(--error-200));
        color: var(--error-800);
      }

      .badge-perfil.secretario {
        background: linear-gradient(
          135deg,
          var(--success-100),
          var(--success-200)
        );
        color: var(--success-800);
      }

      .badge-perfil.solicitante {
        background: linear-gradient(
          135deg,
          var(--primary-100),
          var(--primary-200)
        );
        color: var(--primary-800);
      }

      .badge-perfil.estagiario {
        background: linear-gradient(
          135deg,
          var(--warning-100),
          var(--warning-200)
        );
        color: var(--warning-800);
      }

      /* =====================================================================
         EMPTY STATE / LISTA VAZIA
         ===================================================================== */
      .empty-state,
      .lista-vazia {
        text-align: center;
        padding: 40px 20px;
        color: #94a3b8;
        font-size: 0.9rem;
      }

      .empty-state .empty-icon,
      .lista-vazia i {
        font-size: 32px;
        display: block;
        margin-bottom: 12px;
        opacity: 0.4;
      }

      /* =====================================================================
         LOADING
         ===================================================================== */
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        color: var(--neutral-500);
      }

      .loading-spinner,
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid var(--cinza-borda);
        border-top-color: var(--verde);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* =====================================================================
         NOTIFICAÇÕES TOAST (centro inferior — padrão Biblioteca)
         ===================================================================== */
      .notification-center {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        pointer-events: none;
      }

      .notification-toast {
        pointer-events: all;
        background: white;
        border-radius: 16px;
        padding: 16px 24px;
        min-width: 320px;
        max-width: 500px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        display: flex;
        align-items: flex-start;
        gap: 14px;
        animation: notificationSlideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        border-left: 5px solid;
        position: relative;
        transition: all 0.3s;
      }

      .notification-toast.removing {
        animation: notificationSlideDown 0.3s ease-in forwards;
      }

      @keyframes notificationSlideUp {
        0% {
          opacity: 0;
          transform: translateY(30px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes notificationSlideDown {
        0% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(30px);
        }
      }

      .notification-toast.notification-success {
        border-left-color: var(--verde);
        background: var(--verde-suave);
      }
      .notification-toast.notification-error {
        border-left-color: var(--vermelho);
        background: var(--vermelho-suave);
      }
      .notification-toast.notification-warning {
        border-left-color: var(--amarelo);
        background: var(--amarelo-suave);
      }
      .notification-toast.notification-info {
        border-left-color: var(--azul);
        background: var(--azul-claro);
      }

      .notification-icon {
        font-size: 24px;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .notification-content {
        flex: 1;
      }
      .notification-title {
        font-weight: 700;
        font-size: 15px;
        margin-bottom: 4px;
      }
      .notification-success .notification-title {
        color: var(--verde);
      }
      .notification-error .notification-title {
        color: var(--vermelho);
      }
      .notification-warning .notification-title {
        color: var(--amarelo);
      }
      .notification-info .notification-title {
        color: var(--azul);
      }
      .notification-message {
        font-size: 13px;
        color: var(--cinza-texto);
        line-height: 1.4;
      }

      .notification-close {
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: #a0aec0;
        flex-shrink: 0;
        margin-top: -2px;
        width: 24px;
        height: 24px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      .notification-close:hover {
        background: rgba(0, 0, 0, 0.05);
        color: #0f172a;
      }

      /* =====================================================================
         MODAL DE CONFIRMAÇÃO (padrão Biblioteca)
         ===================================================================== */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(4px);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        animation: fadeIn 0.2s ease;
      }

      .modal-confirm {
        background: white;
        border-radius: 20px;
        padding: 40px 32px;
        max-width: 440px;
        width: 90%;
        text-align: center;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        animation: modalPop 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid var(--cinza-borda);
      }

      .modal-confirm-icon {
        font-size: 3rem;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--amarelo-suave);
        margin-left: auto;
        margin-right: auto;
      }

      .modal-confirm-title {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--neutral-900);
        margin-bottom: 12px;
      }

      .modal-confirm-message {
        font-size: 0.95rem;
        color: var(--neutral-600);
        margin-bottom: 28px;
        line-height: 1.6;
      }

      .modal-confirm-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      .modal-confirm-actions .btn {
        min-width: 120px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes modalPop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* =====================================================================
         RESPONSIVIDADE
         ===================================================================== */
      @media (max-width: 1024px) {
        .app-layout {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: fixed;
          left: -280px;
          width: 260px;
          z-index: 1000;
          transition: left 0.3s;
        }
        .sidebar.aberta {
          left: 0;
        }
        .btn-toggle-sidebar {
          display: flex !important;
        }
        .stats-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .quick-access-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 768px) {
        .conteudo {
          padding: 1.2rem;
        }
        .topbar {
          padding: 0.9rem 1.2rem;
        }
        .topbar-titulo h1 {
          font-size: 1.1rem;
        }
        .topbar-info {
          display: none;
        }
        .page-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }
        .page-header h1 {
          font-size: 1.4rem;
        }
        .stats-grid {
          grid-template-columns: 1fr 1fr;
          gap: 12px;
        }
        .stat-card .stat-value {
          font-size: 1.6rem;
        }
        .quick-access-grid {
          grid-template-columns: 1fr 1fr;
          gap: 12px;
        }
        .section-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }
        .table {
          font-size: 0.8rem;
        }
        .table th,
        .table td {
          padding: 8px 12px;
        }
        .notification-toast {
          min-width: 90%;
          max-width: 90%;
        }
      }

      @media (max-width: 480px) {
        .conteudo {
          padding: 12px;
        }
        .stats-grid {
          grid-template-columns: 1fr;
        }
        .quick-access-grid {
          grid-template-columns: 1fr;
        }
        .page-header h1 {
          font-size: 1.2rem;
        }
        .stat-card {
          padding: 16px;
        }
        .stat-card .stat-value {
          font-size: 1.4rem;
        }
        .stat-card .stat-icon {
          font-size: 1.6rem;
        }
        .section-body {
          padding: 12px 16px;
        }
      }

      /* =====================================================================
         IMPRESSÃO
         ===================================================================== */
      @media print {
        .topbar,
        .sidebar,
        .quick-access-grid,
        .btn,
        .btn-sm,
        .btn-sair,
        .notification-center,
        .modal-overlay {
          display: none !important;
        }

        .app-layout {
          display: block;
        }

        .stat-card,
        .section-card {
          box-shadow: none !important;
          border: 1px solid #ccc !important;
          break-inside: avoid;
          page-break-inside: avoid;
        }

        .stats-grid {
          grid-template-columns: 1fr 1fr;
        }

        .table th {
          background: #eee !important;
          color: #000 !important;
        }

        .conteudo {
          padding: 0 !important;
        }
      }
    </style>

    <script type="module">
      // ============================================
      // core/index.html - Script Principal
      // Dashboard Administrativo
      // ============================================

      import { supabase } from "/shared/js/supabase.js";
      import { OrgaosService } from "/shared/js/services/orgaos.service.js";
      import { UsuariosService } from "/shared/js/services/usuarios.service.js";
      import { auth } from "/shared/js/auth.js";

      // ============================================
      // VARIÁVEIS GLOBAIS
      // ============================================
      let usuarioAtual = null;
      let stats = {
        orgaos: { total: 0, ativos: 0, inativos: 0, comGestor: 0 },
        usuarios: { total: 0, ativos: 0, inativos: 0, porPerfil: {} },
      };
      let dados = {
        orgaos: [],
        usuarios: [],
        orgaosRecentes: [],
        usuariosRecentes: [],
      };

      // ============================================
      // UTILITÁRIOS
      // ============================================

      // Sistema de notificação no padrão Biblioteca (centro inferior)
      window.showNotification = function (
        type,
        title,
        message,
        duration = 4000,
      ) {
        const container = document.getElementById("notificationCenter");
        if (!container) return;
        const icons = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };
        const toast = document.createElement("div");
        toast.className = `notification-toast notification-${type}`;
        toast.innerHTML = `
          <span class="notification-icon">${icons[type]}</span>
          <div class="notification-content">
            <div class="notification-title">${title}</div>
            <div class="notification-message">${message}</div>
          </div>
          <button class="notification-close">✕</button>
        `;
        container.appendChild(toast);
        toast
          .querySelector(".notification-close")
          .addEventListener("click", () => {
            toast.classList.add("removing");
            setTimeout(() => toast.remove(), 300);
          });
        if (duration > 0) {
          setTimeout(() => {
            if (toast.parentElement) {
              toast.classList.add("removing");
              setTimeout(() => toast.remove(), 300);
            }
          }, duration);
        }
        return toast;
      };

      // Mapeia o tipo português (usado no JS atual) para o padrão inglês
      function mostrarToast(tipo, titulo, mensagem, duracao = 4000) {
        const mapa = {
          sucesso: "success",
          erro: "error",
          aviso: "warning",
          info: "info",
        };
        return window.showNotification(
          mapa[tipo] || "info",
          titulo,
          mensagem,
          duracao,
        );
      }

      function formatarData(data) {
        if (!data) return "-";
        try {
          const d = new Date(data);
          return d.toLocaleDateString("pt-BR");
        } catch {
          return data;
        }
      }

      function mostrarLoading(show) {
        const container = document.getElementById("loadingContainer");
        if (container) {
          container.style.display = show ? "flex" : "none";
        }
        const content = document.querySelector(".dashboard-content");
        if (content) {
          content.style.display = show ? "none" : "block";
        }
      }

      function iniciais(nome) {
        if (!nome) return "?";
        const p = nome.trim().split(/\s+/);
        if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
        return (p[0][0] + p[p.length - 1][0]).toUpperCase();
      }

      function setTexto(id, valor) {
        const el = document.getElementById(id);
        if (el) el.textContent = valor;
      }

      // ============================================
      // SIDEBAR TOGGLE (mobile)
      // ============================================
      window.toggleSidebar = function () {
        const sidebar = document.getElementById("sidebar");
        if (sidebar) sidebar.classList.toggle("aberta");
      };

      // Fecha a sidebar ao clicar em um link (mobile)
      (function bindSidebarLinks() {
        const sidebar = document.getElementById("sidebar");
        if (sidebar) {
          sidebar.querySelectorAll("a").forEach((a) => {
            a.addEventListener("click", () =>
              sidebar.classList.remove("aberta"),
            );
          });
        }
      })();

      // ============================================
      // AUTENTICAÇÃO
      // ============================================
      async function verificarAutenticacao() {
        try {
          const session = await auth.verificarSessao();
          if (!session) {
            window.location.href = "/index.html";
            return false;
          }

          const usuario = await auth.obterUsuarioAtual();
          if (!usuario) {
            window.location.href = "/index.html";
            return false;
          }

          // Verificar se é ADMIN
          if (usuario.perfil !== "ADMIN") {
            mostrarToast(
              "erro",
              "Acesso negado",
              "Apenas administradores podem acessar esta área.",
            );
            setTimeout(() => {
              window.location.href = "/intranet.html";
            }, 2000);
            return false;
          }

          usuarioAtual = usuario;
          return true;
        } catch (error) {
          console.error("Erro ao verificar autenticação:", error);
          window.location.href = "/index.html";
          return false;
        }
      }

      // ============================================
      // ATUALIZAR INTERFACE DO USUÁRIO
      // ============================================
      function atualizarInterfaceUsuario() {
        if (!usuarioAtual) return;

        setTexto("topbarNome", usuarioAtual.nome || "Usuário");
        setTexto(
          "topbarData",
          new Date().toLocaleDateString("pt-BR", {
            day: "2-digit",
            month: "short",
            year: "numeric",
          }),
        );

        const avatar = document.getElementById("avatarIniciais");
        if (avatar && usuarioAtual.nome) {
          avatar.textContent = iniciais(usuarioAtual.nome);
        }
      }

      // ============================================
      // CARREGAR DADOS
      // ============================================
      async function carregarDados() {
        try {
          mostrarLoading(true);

          // Carregar estatísticas em paralelo
          const [statsOrgaos, statsUsuarios, orgaos, usuarios] =
            await Promise.all([
              OrgaosService.obterEstatisticas(),
              UsuariosService.obterEstatisticas(),
              OrgaosService.listar({ onlyActive: true }),
              UsuariosService.listar({ onlyActive: true }),
            ]);

          stats.orgaos = statsOrgaos;
          stats.usuarios = statsUsuarios;
          dados.orgaos = orgaos;
          dados.usuarios = usuarios;

          // Dados recentes
          dados.orgaosRecentes = orgaos.slice(0, 5);
          dados.usuariosRecentes = usuarios.slice(0, 5);

          renderizarDashboard();
        } catch (error) {
          console.error("Erro ao carregar dados:", error);
          mostrarToast(
            "erro",
            "Erro",
            "Não foi possível carregar os dados do dashboard.",
          );
        } finally {
          mostrarLoading(false);
        }
      }

      // ============================================
      // RENDERIZAR DASHBOARD
      // ============================================
      function renderizarDashboard() {
        const container = document.getElementById("pageContent");
        if (!container) return;

        const totalUsuarios = stats.usuarios.total || 0;
        const totalOrgaos = stats.orgaos.total || 0;

        container.innerHTML = `
                <div class="dashboard-content">
                    <div class="page-header">
                        <div>
                            <h1><i class="fas fa-cog"></i> Painel Administrativo</h1>
                            <span class="subtitle">Bem-vindo, ${usuarioAtual?.nome || "Administrador"}! Gerencie o sistema em um só lugar.</span>
                        </div>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <button class="btn btn-outline btn-sm" onclick="window.location.href='/core/orgaos/index.html'">
                                <i class="fas fa-building"></i> Gerenciar Órgãos
                            </button>
                            <button class="btn btn-outline btn-sm" onclick="window.location.href='/core/usuarios/index.html'">
                                <i class="fas fa-users"></i> Gerenciar Usuários
                            </button>
                        </div>
                    </div>

                    <!-- Stats Cards -->
                    <div class="stats-grid">
                        <div class="stat-card stat-azul">
                            <span class="stat-icon"><i class="fas fa-users"></i></span>
                            <span class="stat-value">${totalUsuarios}</span>
                            <span class="stat-label">Total de Usuários</span>
                            <div class="stat-change neutral">
                                <i class="fas fa-minus"></i> Ativos: ${stats.usuarios.ativos || 0}
                            </div>
                            <div class="stat-footer">
                                <a href="/core/usuarios/index.html">Ver todos <i class="fas fa-arrow-right"></i></a>
                            </div>
                        </div>

                        <div class="stat-card stat-verde">
                            <span class="stat-icon"><i class="fas fa-building"></i></span>
                            <span class="stat-value">${totalOrgaos}</span>
                            <span class="stat-label">Total de Órgãos</span>
                            <div class="stat-change neutral">
                                <i class="fas fa-minus"></i> Ativos: ${stats.orgaos.ativos || 0}
                            </div>
                            <div class="stat-footer">
                                <a href="/core/orgaos/index.html">Ver todos <i class="fas fa-arrow-right"></i></a>
                            </div>
                        </div>

                        <div class="stat-card stat-amarelo">
                            <span class="stat-icon"><i class="fas fa-user-tag"></i></span>
                            <span class="stat-value">${Object.keys(stats.usuarios.porPerfil || {}).length}</span>
                            <span class="stat-label">Perfis de Acesso</span>
                            <div class="stat-change neutral">
                                <i class="fas fa-minus"></i> ${Object.entries(
                                  stats.usuarios.porPerfil || {},
                                )
                                  .map(
                                    ([perfil, count]) => `${perfil}: ${count}`,
                                  )
                                  .join(" | ")}
                            </div>
                            <div class="stat-footer">
                                <a href="/core/permissoes/index.html">Gerenciar <i class="fas fa-arrow-right"></i></a>
                            </div>
                        </div>

                        <div class="stat-card stat-vermelho">
                            <span class="stat-icon"><i class="fas fa-users-cog"></i></span>
                            <span class="stat-value">${stats.orgaos.comGestor || 0}</span>
                            <span class="stat-label">Órgãos com Gestor</span>
                            <div class="stat-change neutral">
                                <i class="fas fa-minus"></i> ${(((stats.orgaos.comGestor || 0) / (totalOrgaos || 1)) * 100).toFixed(0)}% do total
                            </div>
                            <div class="stat-footer">
                                <a href="/core/orgaos/index.html">Ver todos <i class="fas fa-arrow-right"></i></a>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Access -->
                    <div class="quick-access-grid">
                        <div class="quick-card" onclick="window.location.href='/core/orgaos/index.html'">
                            <div class="quick-icon"><i class="fas fa-building"></i></div>
                            <div class="quick-title">Órgãos</div>
                            <div class="quick-desc">Gerenciar órgãos municipais</div>
                            <span class="quick-badge badge-count">${totalOrgaos} cadastrados</span>
                        </div>
                        <div class="quick-card" onclick="window.location.href='/core/usuarios/index.html'">
                            <div class="quick-icon"><i class="fas fa-users"></i></div>
                            <div class="quick-title">Usuários</div>
                            <div class="quick-desc">Gerenciar usuários do sistema</div>
                            <span class="quick-badge badge-count">${totalUsuarios} cadastrados</span>
                        </div>
                        <div class="quick-card" onclick="window.location.href='/core/permissoes/index.html'">
                            <div class="quick-icon"><i class="fas fa-key"></i></div>
                            <div class="quick-title">Permissões</div>
                            <div class="quick-desc">Controlar acessos e perfis</div>
                            <span class="quick-badge badge-count">${Object.keys(stats.usuarios.porPerfil || {}).length} perfis</span>
                        </div>
                        <div class="quick-card" onclick="window.location.href='/intranet.html'">
                            <div class="quick-icon"><i class="fas fa-arrow-left"></i></div>
                            <div class="quick-title">Voltar</div>
                            <div class="quick-desc">Retornar à intranet</div>
                            <span class="quick-badge badge-count" style="background: var(--cinza-suave); color: var(--neutral-600); border-color: var(--cinza-borda);">←</span>
                        </div>
                    </div>

                    <!-- Órgãos Recentes -->
                    <div class="section-card">
                        <div class="section-header">
                            <h3><i class="fas fa-building"></i> Órgãos Recentes</h3>
                            <a href="/core/orgaos/index.html" class="btn-link">
                                Ver todos <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                        <div class="section-body">
                            <div class="table-container">
                                ${renderizarTabelaOrgaos(dados.orgaosRecentes)}
                            </div>
                        </div>
                    </div>

                    <!-- Usuários Recentes -->
                    <div class="section-card">
                        <div class="section-header">
                            <h3><i class="fas fa-users"></i> Usuários Recentes</h3>
                            <a href="/core/usuarios/index.html" class="btn-link">
                                Ver todos <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                        <div class="section-body">
                            <div class="table-container">
                                ${renderizarTabelaUsuarios(dados.usuariosRecentes)}
                            </div>
                        </div>
                    </div>

                    <!-- Footer Info -->
                    <div style="text-align: center; padding: 16px; color: var(--neutral-400); font-size: 0.8rem; border-top: 1px solid var(--cinza-borda); margin-top: 16px;">
                        <i class="fas fa-sync-alt"></i> Última atualização: ${new Date().toLocaleString("pt-BR")}
                        <span style="margin: 0 12px;">|</span>
                        <i class="fas fa-database"></i> ${totalOrgaos} órgãos · ${totalUsuarios} usuários
                    </div>
                </div>
            `;
      }

      // ============================================
      // RENDERIZAR TABELA DE ÓRGÃOS
      // ============================================
      function renderizarTabelaOrgaos(orgaosList) {
        if (!orgaosList || orgaosList.length === 0) {
          return `
                    <div class="lista-vazia">
                        <i class="fas fa-building"></i>
                        <p>Nenhum órgão cadastrado.</p>
                    </div>
                `;
        }

        return `
                <table class="table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Sigla</th>
                            <th>Gestor</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${orgaosList
                          .map(
                            (o) => `
                            <tr>
                                <td><strong>${o.nome}</strong></td>
                                <td><span class="badge-perfil" style="background: var(--primary-100); color: var(--primary-800);">${o.sigla || "-"}</span></td>
                                <td>${o.gestor_atual || "-"}</td>
                                <td><span class="status-badge ${o.ativo ? "status-ativo" : "status-inativo"}">${o.ativo ? "Ativo" : "Inativo"}</span></td>
                            </tr>
                        `,
                          )
                          .join("")}
                    </tbody>
                </table>
            `;
      }

      // ============================================
      // RENDERIZAR TABELA DE USUÁRIOS
      // ============================================
      function renderizarTabelaUsuarios(usuariosList) {
        if (!usuariosList || usuariosList.length === 0) {
          return `
                    <div class="lista-vazia">
                        <i class="fas fa-users"></i>
                        <p>Nenhum usuário cadastrado.</p>
                    </div>
                `;
        }

        const orgaosMap = {};
        dados.orgaos.forEach((o) => {
          orgaosMap[o.id] = o;
        });

        return `
                <table class="table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                            <th>Órgão</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${usuariosList
                          .map((u) => {
                            const perfilClass = u.perfil
                              ? u.perfil.toLowerCase()
                              : "solicitante";
                            const orgao = orgaosMap[u.orgao_id];
                            return `
                                <tr>
                                    <td><strong>${u.nome}</strong></td>
                                    <td>${u.email}</td>
                                    <td><span class="badge-perfil ${perfilClass}">${u.perfil || "SOLICITANTE"}</span></td>
                                    <td>${orgao ? orgao.nome : "-"}</td>
                                    <td><span class="status-badge ${u.ativo ? "status-ativo" : "status-inativo"}">${u.ativo ? "Ativo" : "Inativo"}</span></td>
                                </tr>
                            `;
                          })
                          .join("")}
                    </tbody>
                </table>
            `;
      }

      // ============================================
      // MODAL DE CONFIRMAÇÃO
      // ============================================
      function showConfirm(title, message, icon = "⚠️") {
        return new Promise((resolve) => {
          const modal = document.getElementById("confirmModal");
          const confirmIcon = document.getElementById("confirmIcon");
          const confirmTitle = document.getElementById("confirmTitle");
          const confirmMessage = document.getElementById("confirmMessage");
          const confirmOkBtn = document.getElementById("confirmOkBtn");
          const confirmCancelBtn = document.getElementById("confirmCancelBtn");

          if (!modal) {
            resolve(confirm(`${icon} ${title}\n\n${message}`));
            return;
          }

          confirmIcon.textContent = icon;
          confirmTitle.textContent = title;
          confirmMessage.textContent = message;

          modal.style.display = "flex";

          function cleanup() {
            modal.style.display = "none";
            confirmOkBtn.removeEventListener("click", handleConfirm);
            confirmCancelBtn.removeEventListener("click", handleCancel);
            modal.removeEventListener("click", handleClickOutside);
          }

          function handleConfirm() {
            cleanup();
            resolve(true);
          }

          function handleCancel() {
            cleanup();
            resolve(false);
          }

          function handleClickOutside(e) {
            if (e.target === modal) {
              cleanup();
              resolve(false);
            }
          }

          confirmOkBtn.addEventListener("click", handleConfirm);
          confirmCancelBtn.addEventListener("click", handleCancel);
          modal.addEventListener("click", handleClickOutside);
        });
      }

      // ============================================
      // LOGOUT
      // ============================================
      document.getElementById("btnSair").addEventListener("click", async () => {
        const confirmado = await showConfirm(
          "Sair do sistema",
          "Tem certeza que deseja sair?",
          "🔓",
        );
        if (confirmado) {
          await auth.logout();
          window.location.href = "/index.html";
        }
      });

      // ============================================
      // INICIALIZAÇÃO
      // ============================================
      async function init() {
        // Verificar autenticação
        const autenticado = await verificarAutenticacao();
        if (!autenticado) return;

        // Atualizar interface do usuário
        atualizarInterfaceUsuario();

        // Carregar dados
        await carregarDados();

        // Configurar eventos de teclado global
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            const modals = document.querySelectorAll(".modal-overlay");
            modals.forEach((modal) => {
              if (modal.style.display !== "none") {
                modal.style.display = "none";
              }
            });
          }
        });
      }

      // Iniciar
      init();

      // ============================================
      // EXPOR FUNÇÕES GLOBAIS
      // ============================================
      window.mostrarToast = mostrarToast;
      window.formatarData = formatarData;
      window.showConfirm = showConfirm;
    </script>
      <script src="../shared/js/system-shell.js"></script>
</body>
</html>
