<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Administrativo · Core</title>

    <!-- Font Awesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <style>
      /* ============================================ */
      /* DESIGN SYSTEM - VARIÁVEIS GLOBAIS            */
      /* ============================================ */
      :root {
        --primary-50: #ecfdf5;
        --primary-100: #d1fae5;
        --primary-200: #a7f3d0;
        --primary-300: #6ee7b7;
        --primary-400: #34d399;
        --primary-500: #10b981;
        --primary-600: #0d5e3a;
        --primary-700: #1a3a6b;
        --primary-800: #064e3b;
        --primary-900: #022c22;

        --success-50: #ecfdf5;
        --success-100: #d1fae5;
        --success-200: #a7f3d0;
        --success-300: #6ee7b7;
        --success-400: #34d399;
        --success-500: #10b981;
        --success-600: #059669;
        --success-700: #047857;
        --success-800: #065f46;

        --warning-50: #fffbeb;
        --warning-100: #fef3c7;
        --warning-200: #fde68a;
        --warning-300: #fcd34d;
        --warning-400: #fbbf24;
        --warning-500: #f59e0b;
        --warning-600: #d97706;
        --warning-700: #b45309;
        --warning-800: #92400e;

        --error-50: #fef2f2;
        --error-100: #fee2e2;
        --error-200: #fecaca;
        --error-300: #fca5a5;
        --error-400: #f87171;
        --error-500: #ef4444;
        --error-600: #dc2626;
        --error-700: #b91c1c;
        --error-800: #991b1b;

        --neutral-50: #f8fafc;
        --neutral-100: #f1f5f9;
        --neutral-200: #e2e8f0;
        --neutral-300: #cbd5e1;
        --neutral-400: #94a3b8;
        --neutral-500: #64748b;
        --neutral-600: #475569;
        --neutral-700: #334155;
        --neutral-800: #1e293b;
        --neutral-900: #0f172a;

        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md:
          0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg:
          0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-xl:
          0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        --transition-base: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --border-radius-sm: 0.375rem;
        --border-radius-md: 0.5rem;
        --border-radius-lg: 0.75rem;
        --border-radius-xl: 1rem;
        --border-radius-2xl: 1.25rem;
      }

      /* ============================================ */
      /* RESET E BASE                                 */
      /* ============================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #f1f5f9 0%, #e6edf5 100%);
        color: var(--neutral-900);
        min-height: 100vh;
        line-height: 1.5;
        font-size: 14px;
        position: relative;
      }

      /* ============================================ */
      /* CORE HEADER                                  */
      /* ============================================ */
      .core-header {
        background: linear-gradient(
          135deg,
          var(--primary-700),
          var(--neutral-800)
        );
        color: white;
        padding: 16px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        box-shadow: var(--shadow-xl);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .core-header .header-left {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .core-header .header-left h1 {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
      }

      .core-header .header-left h1 i {
        color: var(--primary-300);
        margin-right: 10px;
      }

      .btn-toggle-sidebar {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: white;
        font-size: 1.2rem;
        padding: 8px 12px;
        border-radius: var(--border-radius-md);
        cursor: pointer;
        transition: var(--transition-base);
      }

      .btn-toggle-sidebar:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .core-header .header-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 40px;
        backdrop-filter: blur(10px);
      }

      .user-avatar {
        width: 32px;
        height: 32px;
        background: linear-gradient(
          135deg,
          var(--primary-400),
          var(--primary-500)
        );
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--neutral-900);
        font-weight: 700;
        font-size: 0.8rem;
      }

      .btn {
        padding: 8px 18px;
        border-radius: var(--border-radius-lg);
        font-weight: 600;
        cursor: pointer;
        border: none;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: var(--transition-base);
        font-family: inherit;
      }

      .btn-outline {
        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: white;
      }

      .btn-outline:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .btn-sm {
        padding: 6px 14px;
        font-size: 0.8rem;
      }

      .badge-perfil {
        background: rgba(255, 255, 255, 0.2);
        padding: 2px 10px;
        border-radius: 40px;
        font-size: 0.65rem;
        font-weight: 600;
        color: white;
      }

      /* ============================================ */
      /* CORE SIDEBAR                                 */
      /* ============================================ */
      .core-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 260px;
        height: 100vh;
        background: linear-gradient(
          180deg,
          var(--neutral-800),
          var(--neutral-900)
        );
        color: rgba(255, 255, 255, 0.8);
        padding-top: 80px;
        z-index: 90;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        overflow-y: auto;
      }

      .core-sidebar.open {
        transform: translateX(0);
      }

      .sidebar-nav ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .sidebar-nav li {
        margin: 2px 12px;
      }

      .sidebar-nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        border-radius: var(--border-radius-lg);
        transition: var(--transition-base);
        font-size: 0.9rem;
        font-weight: 500;
      }

      .sidebar-nav a:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }

      .sidebar-nav li.active a {
        background: rgba(255, 255, 255, 0.15);
        color: white;
      }

      .sidebar-nav a i {
        width: 20px;
        text-align: center;
      }

      .sidebar-divider {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        margin: 8px 16px;
      }

      .sidebar-footer {
        padding: 16px 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 0.7rem;
        opacity: 0.5;
        text-align: center;
        margin-top: 16px;
      }

      /* ============================================ */
      /* CORE MAIN                                   */
      /* ============================================ */
      .core-main {
        margin-left: 0;
        padding: 0;
        min-height: calc(100vh - 70px);
      }

      /* ============================================ */
      /* DASHBOARD CONTAINER                         */
      /* ============================================ */
      .dashboard-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      /* ============================================ */
      /* PAGE HEADER                                  */
      /* ============================================ */
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 16px;
      }

      .page-header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--neutral-900);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .page-header h1 i {
        color: var(--primary-600);
      }

      .page-header .subtitle {
        font-size: 0.9rem;
        color: var(--neutral-500);
        font-weight: 400;
        display: block;
        margin-top: 4px;
      }

      /* ============================================ */
      /* STATS CARDS                                  */
      /* ============================================ */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 32px;
      }

      .stat-card {
        background: white;
        border-radius: var(--border-radius-2xl);
        padding: 24px;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--neutral-200);
        transition: var(--transition-base);
        position: relative;
        overflow: hidden;
      }

      .stat-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
      }

      .stat-card .stat-icon {
        font-size: 2rem;
        margin-bottom: 12px;
        display: inline-block;
      }

      .stat-card .stat-value {
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--neutral-900);
        display: block;
        line-height: 1.2;
      }

      .stat-card .stat-label {
        font-size: 0.85rem;
        color: var(--neutral-500);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 4px;
      }

      .stat-card .stat-change {
        font-size: 0.8rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 12px;
        border-radius: 20px;
        margin-top: 8px;
      }

      .stat-change.up {
        background: var(--success-50);
        color: var(--success-700);
      }

      .stat-change.down {
        background: var(--error-50);
        color: var(--error-700);
      }

      .stat-change.neutral {
        background: var(--neutral-100);
        color: var(--neutral-600);
      }

      .stat-card .stat-footer {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--neutral-100);
        font-size: 0.8rem;
        color: var(--neutral-500);
      }

      .stat-card .stat-footer a {
        color: var(--primary-600);
        text-decoration: none;
        font-weight: 600;
      }

      .stat-card .stat-footer a:hover {
        text-decoration: underline;
      }

      /* Cores específicas por tipo */
      .stat-card.stat-verde .stat-icon {
        color: var(--success-600);
      }
      .stat-card.stat-verde .stat-value {
        color: var(--success-700);
      }

      .stat-card.stat-azul .stat-icon {
        color: var(--primary-600);
      }
      .stat-card.stat-azul .stat-value {
        color: var(--primary-700);
      }

      .stat-card.stat-vermelho .stat-icon {
        color: var(--error-600);
      }
      .stat-card.stat-vermelho .stat-value {
        color: var(--error-700);
      }

      .stat-card.stat-amarelo .stat-icon {
        color: var(--warning-600);
      }
      .stat-card.stat-amarelo .stat-value {
        color: var(--warning-700);
      }

      /* ============================================ */
      /* QUICK ACCESS CARDS                           */
      /* ============================================ */
      .quick-access-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 32px;
      }

      .quick-card {
        background: white;
        border-radius: var(--border-radius-xl);
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition: var(--transition-base);
        border: 2px solid transparent;
        box-shadow: var(--shadow-sm);
      }

      .quick-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
        border-color: var(--primary-200);
      }

      .quick-card .quick-icon {
        font-size: 2.2rem;
        color: var(--primary-600);
        margin-bottom: 12px;
      }

      .quick-card .quick-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--neutral-900);
      }

      .quick-card .quick-desc {
        font-size: 0.8rem;
        color: var(--neutral-500);
        margin-top: 4px;
      }

      .quick-card .quick-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 600;
        margin-top: 8px;
      }

      .quick-card .quick-badge.badge-count {
        background: var(--primary-100);
        color: var(--primary-800);
      }

      /* ============================================ */
      /* SECTION CARDS                                */
      /* ============================================ */
      .section-card {
        background: white;
        border-radius: var(--border-radius-2xl);
        box-shadow: var(--shadow-md);
        border: 1px solid var(--neutral-200);
        overflow: hidden;
        margin-bottom: 24px;
      }

      .section-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--neutral-200);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(135deg, white, var(--neutral-50));
        flex-wrap: wrap;
        gap: 12px;
      }

      .section-header h3 {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--neutral-900);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section-header h3 i {
        color: var(--primary-600);
      }

      .section-header .btn-link {
        color: var(--primary-600);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .section-header .btn-link:hover {
        text-decoration: underline;
      }

      .section-body {
        padding: 20px 24px;
      }

      /* ============================================ */
      /* TABELA                                      */
      /* ============================================ */
      .table-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .table th {
        background: var(--neutral-50);
        padding: 12px 16px;
        text-align: left;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--neutral-500);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 2px solid var(--neutral-200);
      }

      .table td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--neutral-100);
        color: var(--neutral-700);
        vertical-align: middle;
      }

      .table tbody tr:hover td {
        background: var(--neutral-50);
      }

      .table .status-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .table .status-ativo {
        background: var(--success-100);
        color: var(--success-800);
      }

      .table .status-inativo {
        background: var(--error-100);
        color: var(--error-800);
      }

      .table .badge-perfil {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 600;
      }

      .badge-perfil.admin {
        background: linear-gradient(135deg, var(--error-100), var(--error-200));
        color: var(--error-800);
      }

      .badge-perfil.secretario {
        background: linear-gradient(
          135deg,
          var(--success-100),
          var(--success-200)
        );
        color: var(--success-800);
      }

      .badge-perfil.solicitante {
        background: linear-gradient(
          135deg,
          var(--primary-100),
          var(--primary-200)
        );
        color: var(--primary-800);
      }

      .badge-perfil.estagiario {
        background: linear-gradient(
          135deg,
          var(--warning-100),
          var(--warning-200)
        );
        color: var(--warning-800);
      }

      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--neutral-400);
      }

      .empty-state .empty-icon {
        font-size: 32px;
        display: block;
        margin-bottom: 12px;
      }

      /* ============================================ */
      /* LOADING                                     */
      /* ============================================ */
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        color: var(--neutral-500);
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid var(--neutral-200);
        border-top-color: var(--primary-600);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ============================================ */
      /* TOAST                                      */
      /* ============================================ */
      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .toast {
        min-width: 280px;
        max-width: 350px;
        padding: 14px 18px;
        border-radius: var(--border-radius-lg);
        box-shadow: var(--shadow-xl);
        display: flex;
        align-items: center;
        gap: 12px;
        animation:
          slideInToast 0.3s ease,
          fadeOutToast 0.3s ease 2.7s forwards;
        background: white;
        border-left: 4px solid;
      }

      .toast.sucesso {
        border-left-color: var(--success-600);
      }
      .toast.erro {
        border-left-color: var(--error-600);
      }
      .toast.aviso {
        border-left-color: var(--warning-600);
      }
      .toast.info {
        border-left-color: var(--primary-600);
      }

      .toast i {
        font-size: 1.2rem;
      }
      .toast.sucesso i {
        color: var(--success-600);
      }
      .toast.erro i {
        color: var(--error-600);
      }
      .toast.aviso i {
        color: var(--warning-600);
      }
      .toast.info i {
        color: var(--primary-600);
      }

      .toast span {
        flex: 1;
        font-size: 0.9rem;
        color: var(--neutral-800);
      }

      .toast .btn-fechar {
        background: none;
        border: none;
        color: var(--neutral-400);
        cursor: pointer;
        font-size: 1rem;
        padding: 0;
      }

      .toast .btn-fechar:hover {
        color: var(--neutral-600);
      }

      @keyframes slideInToast {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes fadeOutToast {
        to {
          opacity: 0;
          transform: translateX(10px);
        }
      }

      /* ============================================ */
      /* MODAL DE CONFIRMAÇÃO                        */
      /* ============================================ */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.2s ease;
      }

      .modal-confirm {
        background: white;
        border-radius: var(--border-radius-2xl);
        padding: 40px 32px;
        max-width: 440px;
        width: 90%;
        text-align: center;
        box-shadow: var(--shadow-xl);
        animation: modalPop 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid var(--neutral-200);
      }

      .modal-confirm-icon {
        font-size: 56px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--warning-50);
        margin-left: auto;
        margin-right: auto;
      }

      .modal-confirm-title {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--neutral-900);
        margin-bottom: 12px;
      }

      .modal-confirm-message {
        font-size: 0.95rem;
        color: var(--neutral-600);
        margin-bottom: 28px;
        line-height: 1.6;
      }

      .modal-confirm-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      .modal-confirm-actions .btn {
        min-width: 120px;
      }

      .btn-secondary {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #e2e8f0;
      }

      .btn-secondary:hover {
        background: #e2e8f0;
      }

      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--primary-600),
          var(--primary-700)
        );
        color: white;
        box-shadow: var(--shadow-sm);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes modalPop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* ============================================ */
      /* RESPONSIVIDADE                               */
      /* ============================================ */
      @media (min-width: 769px) {
        .core-sidebar {
          transform: translateX(0) !important;
        }
        .core-main {
          margin-left: 260px;
        }
        .btn-toggle-sidebar {
          display: none;
        }
      }

      @media (max-width: 1024px) {

      /* ============================================ */

      @media print {

    </style>

    <!-- ============================================ -->

    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
        }
      }
    </script>

    <script type="module">
      // ============================================
      // core/index.html - Script Principal
      // Dashboard Administrativo
      // ============================================

      import { supabase } from "/shared/js/supabase.js";
      import { OrgaosService } from "/shared/js/services/orgaos.service.js";
      import { UsuariosService } from "/shared/js/services/usuarios.service.js";
      import { auth } from "/shared/js/auth.js";

      // ============================================
      // VARIÁVEIS GLOBAIS
      // ============================================
      let usuarioAtual = null;
      let stats = {
        orgaos: { total: 0, ativos: 0, inativos: 0, comGestor: 0 },
        usuarios: { total: 0, ativos: 0, inativos: 0, porPerfil: {} },
      };
      let dados = {
        orgaos: [],
        usuarios: [],
        orgaosRecentes: [],
        usuariosRecentes: [],
      };

      // ============================================
      // UTILITÁRIOS
      // ============================================
      function mostrarToast(tipo, titulo, mensagem, duracao = 4000) {
        const container = document.getElementById("toastContainer");
        const icones = {
          sucesso: "✅",
          erro: "❌",
          aviso: "⚠️",
          info: "ℹ️",
        };

        const toast = document.createElement("div");
        toast.className = `toast ${tipo}`;
        toast.innerHTML = `
                <span>${icones[tipo] || "ℹ️"}</span>
                <span><strong>${titulo}</strong><br>${mensagem}</span>
                <button class="btn-fechar" onclick="this.parentElement.remove()">✕</button>
            `;

        container.appendChild(toast);

        if (duracao > 0) {
          setTimeout(() => {
            if (toast.parentElement) {
              toast.style.opacity = "0";
              toast.style.transform = "translateX(20px)";
              setTimeout(() => toast.remove(), 300);
            }
          }, duracao);
        }
      }

      function formatarData(data) {
        if (!data) return "-";
        try {
          const d = new Date(data);
          return d.toLocaleDateString("pt-BR");
        } catch {
          return data;
        }
      }

      function mostrarLoading(show) {
        const container = document.getElementById("loadingContainer");
        if (container) {
          container.style.display = show ? "flex" : "none";
        }
        const content = document.querySelector(".dashboard-content");
        if (content) {
          content.style.display = show ? "none" : "block";
        }
      }

      // ============================================
      // SIDEBAR TOGGLE
      // ============================================
      window.toggleSidebar = function () {
        const sidebar = document.getElementById("coreSidebar");
        sidebar.classList.toggle("open");
      };

      // ============================================
      // AUTENTICAÇÃO
      // ============================================
      async function verificarAutenticacao() {
        try {
          const session = await auth.verificarSessao();
          if (!session) {
            window.location.href = "/index.html";
            return false;
          }

          const usuario = await auth.obterUsuarioAtual();
          if (!usuario) {
            window.location.href = "/index.html";
            return false;
          }

          // Verificar se é ADMIN
          if (usuario.perfil !== "ADMIN") {
            mostrarToast(
              "erro",
              "Acesso negado",
              "Apenas administradores podem acessar esta área.",
            );
            setTimeout(() => {
              window.location.href = "/intranet.html";
            }, 2000);
            return false;
          }

          usuarioAtual = usuario;
          return true;
        } catch (error) {
          console.error("Erro ao verificar autenticação:", error);
          window.location.href = "/index.html";
          return false;
        }
      }

      // ============================================
      // ATUALIZAR INTERFACE DO USUÁRIO
      // ============================================
      function atualizarInterfaceUsuario() {
        if (!usuarioAtual) return;

        document.getElementById("userName").textContent =
          usuarioAtual.nome || "Usuário";
        document.getElementById("userPerfil").textContent =
          usuarioAtual.perfil || "ADMIN";

        const avatar = document.getElementById("userAvatar");
        if (avatar && usuarioAtual.nome) {
          const iniciais = usuarioAtual.nome
            .split(" ")
            .map((n) => n[0])
            .join("")
            .substring(0, 2)
            .toUpperCase();
          avatar.textContent = iniciais;
        }
      }

      // ============================================
      // CARREGAR DADOS
      // ============================================
      async function carregarDados() {
        try {
          mostrarLoading(true);

          // Carregar estatísticas em paralelo
          const [statsOrgaos, statsUsuarios, orgaos, usuarios] =
            await Promise.all([
              OrgaosService.obterEstatisticas(),
              UsuariosService.obterEstatisticas(),
              OrgaosService.listar({ onlyActive: true }),
              UsuariosService.listar({ onlyActive: true }),
            ]);

          stats.orgaos = statsOrgaos;
          stats.usuarios = statsUsuarios;
          dados.orgaos = orgaos;
          dados.usuarios = usuarios;

          // Dados recentes
          dados.orgaosRecentes = orgaos.slice(0, 5);
          dados.usuariosRecentes = usuarios.slice(0, 5);

          renderizarDashboard();
        } catch (error) {
          console.error("Erro ao carregar dados:", error);
          mostrarToast(
            "erro",
            "Erro",
            "Não foi possível carregar os dados do dashboard.",
          );
        } finally {
          mostrarLoading(false);
        }
      }

      // ============================================
      // RENDERIZAR DASHBOARD
      // ============================================
      function renderizarDashboard() {
        const container = document.getElementById("pageContent");
        if (!container) return;

        const totalUsuarios = stats.usuarios.total || 0;
        const totalOrgaos = stats.orgaos.total || 0;

        container.innerHTML = `
                <div class="dashboard-content">
                    <div class="page-header">
                        <div>
                            <h1><i class="fas fa-cog"></i> Painel Administrativo</h1>
                            <span class="subtitle">Bem-vindo, ${usuarioAtual?.nome || "Administrador"}! Gerencie o sistema em um só lugar.</span>
                        </div>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <button class="btn btn-outline btn-sm" onclick="window.location.href='/core/orgaos/index.html'" style="border-color: var(--primary-600); color: var(--primary-600); background: white;">
                                <i class="fas fa-building"></i> Gerenciar Órgãos
                            </button>
                            <button class="btn btn-outline btn-sm" onclick="window.location.href='/core/usuarios/index.html'" style="border-color: var(--primary-600); color: var(--primary-600); background: white;">
                                <i class="fas fa-users"></i> Gerenciar Usuários
                            </button>
                        </div>
                    </div>

                    <!-- Stats Cards -->
                    <div class="stats-grid">
                        <div class="stat-card stat-azul">
                            <span class="stat-icon"><i class="fas fa-users"></i></span>
                            <span class="stat-value">${totalUsuarios}</span>
                            <span class="stat-label">Total de Usuários</span>
                            <div class="stat-change neutral">
                                <i class="fas fa-minus"></i> Ativos: ${stats.usuarios.ativos || 0}
                            </div>
                            <div class="stat-footer">
                                <a href="/core/usuarios/index.html">Ver todos <i class="fas fa-arrow-right"></i></a>
                            </div>
                        </div>

                        <div class="stat-card stat-verde">
                            <span class="stat-icon"><i class="fas fa-building"></i></span>
                            <span class="stat-value">${totalOrgaos}</span>
                            <span class="stat-label">Total de Órgãos</span>
                            <div class="stat-change neutral">
                                <i class="fas fa-minus"></i> Ativos: ${stats.orgaos.ativos || 0}
                            </div>
                            <div class="stat-footer">
                                <a href="/core/orgaos/index.html">Ver todos <i class="fas fa-arrow-right"></i></a>
                            </div>
                        </div>

                        <div class="stat-card stat-amarelo">
                            <span class="stat-icon"><i class="fas fa-user-tag"></i></span>
                            <span class="stat-value">${Object.keys(stats.usuarios.porPerfil || {}).length}</span>
                            <span class="stat-label">Perfis de Acesso</span>
                            <div class="stat-change neutral">
                                <i class="fas fa-minus"></i> ${Object.entries(
                                  stats.usuarios.porPerfil || {},
                                )
                                  .map(
                                    ([perfil, count]) => `${perfil}: ${count}`,
                                  )
                                  .join(" | ")}
                            </div>
                            <div class="stat-footer">
                                <a href="/core/permissoes/index.html">Gerenciar <i class="fas fa-arrow-right"></i></a>
                            </div>
                        </div>

                        <div class="stat-card stat-vermelho">
                            <span class="stat-icon"><i class="fas fa-users-cog"></i></span>
                            <span class="stat-value">${stats.orgaos.comGestor || 0}</span>
                            <span class="stat-label">Órgãos com Gestor</span>
                            <div class="stat-change neutral">
                                <i class="fas fa-minus"></i> ${(((stats.orgaos.comGestor || 0) / (totalOrgaos || 1)) * 100).toFixed(0)}% do total
                            </div>
                            <div class="stat-footer">
                                <a href="/core/orgaos/index.html">Ver todos <i class="fas fa-arrow-right"></i></a>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Access -->
                    <div class="quick-access-grid">
                        <div class="quick-card" onclick="window.location.href='/core/orgaos/index.html'">
                            <div class="quick-icon"><i class="fas fa-building"></i></div>
                            <div class="quick-title">Órgãos</div>
                            <div class="quick-desc">Gerenciar órgãos municipais</div>
                            <span class="quick-badge badge-count">${totalOrgaos} cadastrados</span>
                        </div>
                        <div class="quick-card" onclick="window.location.href='/core/usuarios/index.html'">
                            <div class="quick-icon"><i class="fas fa-users"></i></div>
                            <div class="quick-title">Usuários</div>
                            <div class="quick-desc">Gerenciar usuários do sistema</div>
                            <span class="quick-badge badge-count">${totalUsuarios} cadastrados</span>
                        </div>
                        <div class="quick-card" onclick="window.location.href='/core/permissoes/index.html'">
                            <div class="quick-icon"><i class="fas fa-lock"></i></div>
                            <div class="quick-title">Permissões</div>
                            <div class="quick-desc">Controlar acessos e perfis</div>
                            <span class="quick-badge badge-count">${Object.keys(stats.usuarios.porPerfil || {}).length} perfis</span>
                        </div>
                        <div class="quick-card" onclick="window.location.href='/intranet.html'">
                            <div class="quick-icon"><i class="fas fa-arrow-left"></i></div>
                            <div class="quick-title">Voltar</div>
                            <div class="quick-desc">Retornar à intranet</div>
                            <span class="quick-badge badge-count" style="background: var(--neutral-100); color: var(--neutral-600);">←</span>
                        </div>
                    </div>

                    <!-- Órgãos Recentes -->
                    <div class="section-card">
                        <div class="section-header">
                            <h3><i class="fas fa-building"></i> Órgãos Recentes</h3>
                            <a href="/core/orgaos/index.html" class="btn-link">
                                Ver todos <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                        <div class="section-body">
                            <div class="table-container">
                                ${renderizarTabelaOrgaos(dados.orgaosRecentes)}
                            </div>
                        </div>
                    </div>

                    <!-- Usuários Recentes -->
                    <div class="section-card">
                        <div class="section-header">
                            <h3><i class="fas fa-users"></i> Usuários Recentes</h3>
                            <a href="/core/usuarios/index.html" class="btn-link">
                                Ver todos <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                        <div class="section-body">
                            <div class="table-container">
                                ${renderizarTabelaUsuarios(dados.usuariosRecentes)}
                            </div>
                        </div>
                    </div>

                    <!-- Footer Info -->
                    <div style="text-align: center; padding: 16px; color: var(--neutral-400); font-size: 0.8rem; border-top: 1px solid var(--neutral-200); margin-top: 16px;">
                        <i class="fas fa-sync-alt"></i> Última atualização: ${new Date().toLocaleString("pt-BR")}
                        <span style="margin: 0 12px;">|</span>
                        <i class="fas fa-database"></i> ${totalOrgaos} órgãos · ${totalUsuarios} usuários
                    </div>
                </div>
            `;
      }

      // ============================================
      // RENDERIZAR TABELA DE ÓRGÃOS
      // ============================================
      function renderizarTabelaOrgaos(orgaosList) {
        if (!orgaosList || orgaosList.length === 0) {
          return `
                    <div class="empty-state">
                        <span class="empty-icon"><i class="fas fa-building"></i></span>
                        <p>Nenhum órgão cadastrado.</p>
                    </div>
                `;
        }

        return `
                <table class="table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Sigla</th>
                            <th>Gestor</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${orgaosList
                          .map(
                            (o) => `
                            <tr>
                                <td><strong>${o.nome}</strong></td>
                                <td><span class="badge-perfil" style="background: var(--primary-100); color: var(--primary-800);">${o.sigla || "-"}</span></td>
                                <td>${o.gestor_atual || "-"}</td>
                                <td><span class="status-badge ${o.ativo ? "status-ativo" : "status-inativo"}">${o.ativo ? "Ativo" : "Inativo"}</span></td>
                            </tr>
                        `,
                          )
                          .join("")}
                    </tbody>
                </table>
            `;
      }

      // ============================================
      // RENDERIZAR TABELA DE USUÁRIOS
      // ============================================
      function renderizarTabelaUsuarios(usuariosList) {
        if (!usuariosList || usuariosList.length === 0) {
          return `
                    <div class="empty-state">
                        <span class="empty-icon"><i class="fas fa-users"></i></span>
                        <p>Nenhum usuário cadastrado.</p>
                    </div>
                `;
        }

        const orgaosMap = {};
        dados.orgaos.forEach((o) => {
          orgaosMap[o.id] = o;
        });

        return `
                <table class="table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                            <th>Órgão</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${usuariosList
                          .map((u) => {
                            const perfilClass = u.perfil
                              ? u.perfil.toLowerCase()
                              : "solicitante";
                            const orgao = orgaosMap[u.orgao_id];
                            return `
                                <tr>
                                    <td><strong>${u.nome}</strong></td>
                                    <td>${u.email}</td>
                                    <td><span class="badge-perfil ${perfilClass}">${u.perfil || "SOLICITANTE"}</span></td>
                                    <td>${orgao ? orgao.nome : "-"}</td>
                                    <td><span class="status-badge ${u.ativo ? "status-ativo" : "status-inativo"}">${u.ativo ? "Ativo" : "Inativo"}</span></td>
                                </tr>
                            `;
                          })
                          .join("")}
                    </tbody>
                </table>
            `;
      }

      // ============================================
      // MODAL DE CONFIRMAÇÃO
      // ============================================
      function showConfirm(title, message, icon = "⚠️") {
        return new Promise((resolve) => {
          const modal = document.getElementById("confirmModal");
          const confirmIcon = document.getElementById("confirmIcon");
          const confirmTitle = document.getElementById("confirmTitle");
          const confirmMessage = document.getElementById("confirmMessage");
          const confirmOkBtn = document.getElementById("confirmOkBtn");
          const confirmCancelBtn = document.getElementById("confirmCancelBtn");

          if (!modal) {
            resolve(confirm(`${icon} ${title}\n\n${message}`));
            return;
          }

          confirmIcon.textContent = icon;
          confirmTitle.textContent = title;
          confirmMessage.textContent = message;

          modal.style.display = "flex";

          function cleanup() {
            modal.style.display = "none";
            confirmOkBtn.removeEventListener("click", handleConfirm);
            confirmCancelBtn.removeEventListener("click", handleCancel);
            window.removeEventListener("click", handleClickOutside);
          }

          function handleConfirm() {
            cleanup();
            resolve(true);
          }

          function handleCancel() {
            cleanup();
            resolve(false);
          }

          function handleClickOutside(e) {
            if (e.target === modal) {
              cleanup();
              resolve(false);
            }
          }

          confirmOkBtn.addEventListener("click", handleConfirm);
          confirmCancelBtn.addEventListener("click", handleCancel);
          window.addEventListener("click", handleClickOutside);
        });
      }

      // ============================================
      // LOGOUT
      // ============================================
      document
        .getElementById("btnLogout")
        .addEventListener("click", async () => {
          const confirmado = await showConfirm(
            "Sair do sistema",
            "Tem certeza que deseja sair?",
            "🔓",
          );
          if (confirmado) {
            await auth.logout();
            window.location.href = "/index.html";
          }
        });

      // ============================================
      // INICIALIZAÇÃO
      // ============================================
      async function init() {
        // Verificar autenticação
        const autenticado = await verificarAutenticacao();
        if (!autenticado) return;

        // Atualizar interface do usuário
        atualizarInterfaceUsuario();

        // Carregar dados
        await carregarDados();

        // Configurar eventos de teclado global
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            const modals = document.querySelectorAll(".modal-overlay");
            modals.forEach((modal) => {
              if (modal.style.display !== "none") {
                modal.remove();
              }
            });
          }
        });
      }

      // Iniciar
      init();

      // ============================================
      // EXPOR FUNÇÕES GLOBAIS
      // ============================================
      window.mostrarToast = mostrarToast;
      window.formatarData = formatarData;
      window.showConfirm = showConfirm;
    </script>
  </body>
</html>
