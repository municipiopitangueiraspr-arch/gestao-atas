<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Usuários · Core</title>

    <!-- Font Awesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <style>
      /* ============================================ */
      /* DESIGN SYSTEM - VARIÁVEIS GLOBAIS            */
      /* ============================================ */
      :root {
        --primary-50: #ecfdf5;
        --primary-100: #d1fae5;
        --primary-200: #a7f3d0;
        --primary-300: #6ee7b7;
        --primary-400: #34d399;
        --primary-500: #10b981;
        --primary-600: #0d5e3a;
        --primary-700: #1a3a6b;
        --primary-800: #064e3b;
        --primary-900: #022c22;

        --success-50: #ecfdf5;
        --success-100: #d1fae5;
        --success-200: #a7f3d0;
        --success-300: #6ee7b7;
        --success-400: #34d399;
        --success-500: #10b981;
        --success-600: #059669;
        --success-700: #047857;
        --success-800: #065f46;

        --warning-50: #fffbeb;
        --warning-100: #fef3c7;
        --warning-200: #fde68a;
        --warning-300: #fcd34d;
        --warning-400: #fbbf24;
        --warning-500: #f59e0b;
        --warning-600: #d97706;
        --warning-700: #b45309;
        --warning-800: #92400e;

        --error-50: #fef2f2;
        --error-100: #fee2e2;
        --error-200: #fecaca;
        --error-300: #fca5a5;
        --error-400: #f87171;
        --error-500: #ef4444;
        --error-600: #dc2626;
        --error-700: #b91c1c;
        --error-800: #991b1b;

        --neutral-50: #f8fafc;
        --neutral-100: #f1f5f9;
        --neutral-200: #e2e8f0;
        --neutral-300: #cbd5e1;
        --neutral-400: #94a3b8;
        --neutral-500: #64748b;
        --neutral-600: #475569;
        --neutral-700: #334155;
        --neutral-800: #1e293b;
        --neutral-900: #0f172a;

        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md:
          0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg:
          0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-xl:
          0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        --transition-base: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --border-radius-sm: 0.375rem;
        --border-radius-md: 0.5rem;
        --border-radius-lg: 0.75rem;
        --border-radius-xl: 1rem;
        --border-radius-2xl: 1.25rem;
      }

      /* ============================================ */
      /* RESET E BASE                                 */
      /* ============================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #f1f5f9 0%, #e6edf5 100%);
        color: var(--neutral-900);
        min-height: 100vh;
        line-height: 1.5;
        font-size: 14px;
        position: relative;
      }

      /* ============================================ */
      /* CORE HEADER                                  */
      /* ============================================ */
      .core-header {
        background: linear-gradient(
          135deg,
          var(--primary-700),
          var(--neutral-800)
        );
        color: white;
        padding: 16px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        box-shadow: var(--shadow-xl);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .core-header .header-left {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .core-header .header-left h1 {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
      }

      .core-header .header-left h1 i {
        color: var(--primary-300);
        margin-right: 10px;
      }

      .btn-toggle-sidebar {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: white;
        font-size: 1.2rem;
        padding: 8px 12px;
        border-radius: var(--border-radius-md);
        cursor: pointer;
        transition: var(--transition-base);
      }

      .btn-toggle-sidebar:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .core-header .header-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 40px;
        backdrop-filter: blur(10px);
      }

      .user-avatar {
        width: 32px;
        height: 32px;
        background: linear-gradient(
          135deg,
          var(--primary-400),
          var(--primary-500)
        );
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--neutral-900);
        font-weight: 700;
        font-size: 0.8rem;
      }

      .btn {
        padding: 8px 18px;
        border-radius: var(--border-radius-lg);
        font-weight: 600;
        cursor: pointer;
        border: none;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: var(--transition-base);
        font-family: inherit;
      }

      .btn-outline {
        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: white;
      }

      .btn-outline:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .btn-sm {
        padding: 6px 14px;
        font-size: 0.8rem;
      }

      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--primary-600),
          var(--primary-700)
        );
        color: white;
        box-shadow: var(--shadow-sm);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .btn-success {
        background: var(--success-600);
        color: white;
      }

      .btn-success:hover {
        background: var(--success-700);
        transform: translateY(-2px);
      }

      .btn-danger {
        background: var(--error-600);
        color: white;
      }

      .btn-danger:hover {
        background: var(--error-700);
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #e2e8f0;
      }

      .btn-secondary:hover {
        background: #e2e8f0;
      }

      .badge-perfil {
        background: rgba(255, 255, 255, 0.2);
        padding: 2px 10px;
        border-radius: 40px;
        font-size: 0.65rem;
        font-weight: 600;
        color: white;
      }

      /* ============================================ */
      /* CORE SIDEBAR                                 */
      /* ============================================ */
      .core-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 260px;
        height: 100vh;
        background: linear-gradient(
          180deg,
          var(--neutral-800),
          var(--neutral-900)
        );
        color: rgba(255, 255, 255, 0.8);
        padding-top: 80px;
        z-index: 90;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        overflow-y: auto;
      }

      .core-sidebar.open {
        transform: translateX(0);
      }

      .sidebar-nav ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .sidebar-nav li {
        margin: 2px 12px;
      }

      .sidebar-nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        border-radius: var(--border-radius-lg);
        transition: var(--transition-base);
        font-size: 0.9rem;
        font-weight: 500;
      }

      .sidebar-nav a:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }

      .sidebar-nav li.active a {
        background: rgba(255, 255, 255, 0.15);
        color: white;
      }

      .sidebar-nav a i {
        width: 20px;
        text-align: center;
      }

      .sidebar-divider {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        margin: 8px 16px;
      }

      .sidebar-footer {
        padding: 16px 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 0.7rem;
        opacity: 0.5;
        text-align: center;
        margin-top: 16px;
      }

      /* ============================================ */
      /* CORE MAIN                                   */
      /* ============================================ */
      .core-main {
        margin-left: 0;
        padding: 0;
        min-height: calc(100vh - 70px);
      }

      /* ============================================ */
      /* USUARIOS CONTAINER                           */
      /* ============================================ */
      .usuarios-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      /* ============================================ */
      /* PAGE HEADER                                  */
      /* ============================================ */
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 16px;
      }

      .page-header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--neutral-900);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .page-header h1 i {
        color: var(--primary-600);
      }

      /* ============================================ */
      /* FILTERS BAR                                  */
      /* ============================================ */
      .filters-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        background: white;
        padding: 20px 24px;
        border-radius: var(--border-radius-2xl);
        box-shadow: var(--shadow-md);
        border: 1px solid var(--neutral-200);
        margin-bottom: 24px;
        align-items: flex-end;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 180px;
      }

      .filter-group label {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--neutral-500);
        letter-spacing: 0.5px;
      }

      .filter-group select,
      .filter-group input {
        padding: 10px 14px;
        border: 2px solid var(--neutral-200);
        border-radius: var(--border-radius-lg);
        font-size: 0.9rem;
        transition: var(--transition-base);
        background: white;
        width: 100%;
      }

      .filter-group select:focus,
      .filter-group input:focus {
        outline: none;
        border-color: var(--primary-500);
        box-shadow: 0 0 0 4px var(--primary-100);
      }

      /* ============================================ */
      /* CARD                                        */
      /* ============================================ */
      .card {
        background: white;
        border-radius: var(--border-radius-2xl);
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--neutral-200);
        overflow: hidden;
      }

      /* ============================================ */
      /* TABELA                                      */
      /* ============================================ */
      .table-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .table th {
        background: linear-gradient(
          135deg,
          var(--primary-700),
          var(--neutral-800)
        );
        padding: 14px 16px;
        text-align: left;
        font-size: 0.75rem;
        font-weight: 600;
        color: white;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--neutral-200);
        color: var(--neutral-700);
        background: white;
        vertical-align: middle;
      }

      .table tbody tr:hover td {
        background: var(--neutral-50);
      }

      .table .acoes-cell {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      /* ============================================ */
      /* BADGES                                      */
      /* ============================================ */
      .badge-perfil-sistema {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 40px;
        font-size: 0.7rem;
        font-weight: 600;
      }

      .badge-perfil-sistema.admin {
        background: linear-gradient(135deg, var(--error-100), var(--error-200));
        color: var(--error-800);
      }

      .badge-perfil-sistema.secretario {
        background: linear-gradient(
          135deg,
          var(--success-100),
          var(--success-200)
        );
        color: var(--success-800);
      }

      .badge-perfil-sistema.solicitante {
        background: linear-gradient(
          135deg,
          var(--primary-100),
          var(--primary-200)
        );
        color: var(--primary-800);
      }

      .badge-perfil-sistema.estagiario {
        background: linear-gradient(
          135deg,
          var(--warning-100),
          var(--warning-200)
        );
        color: var(--warning-800);
      }

      .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 40px;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .status-ativo {
        background: var(--success-100);
        color: var(--success-800);
      }

      .status-inativo {
        background: var(--error-100);
        color: var(--error-800);
      }

      /* ============================================ */
      /* EMPTY STATE                                  */
      /* ============================================ */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--neutral-400);
      }

      .empty-state .empty-icon {
        font-size: 48px;
        display: block;
        margin-bottom: 16px;
      }

      /* ============================================ */
      /* LOADING                                     */
      /* ============================================ */
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        color: var(--neutral-500);
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid var(--neutral-200);
        border-top-color: var(--primary-600);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ============================================ */
      /* TOAST                                      */
      /* ============================================ */
      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .toast {
        min-width: 280px;
        max-width: 350px;
        padding: 14px 18px;
        border-radius: var(--border-radius-lg);
        box-shadow: var(--shadow-xl);
        display: flex;
        align-items: center;
        gap: 12px;
        animation:
          slideInToast 0.3s ease,
          fadeOutToast 0.3s ease 2.7s forwards;
        background: white;
        border-left: 4px solid;
      }

      .toast.sucesso {
        border-left-color: var(--success-600);
      }
      .toast.erro {
        border-left-color: var(--error-600);
      }
      .toast.aviso {
        border-left-color: var(--warning-600);
      }
      .toast.info {
        border-left-color: var(--primary-600);
      }

      .toast i {
        font-size: 1.2rem;
      }
      .toast.sucesso i {
        color: var(--success-600);
      }
      .toast.erro i {
        color: var(--error-600);
      }
      .toast.aviso i {
        color: var(--warning-600);
      }
      .toast.info i {
        color: var(--primary-600);
      }

      .toast span {
        flex: 1;
        font-size: 0.9rem;
        color: var(--neutral-800);
      }

      .toast .btn-fechar {
        background: none;
        border: none;
        color: var(--neutral-400);
        cursor: pointer;
        font-size: 1rem;
        padding: 0;
      }

      .toast .btn-fechar:hover {
        color: var(--neutral-600);
      }

      @keyframes slideInToast {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes fadeOutToast {
        to {
          opacity: 0;
          transform: translateX(10px);
        }
      }

      /* ============================================ */
      /* MODAL                                       */
      /* ============================================ */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.2s ease;
      }

      .modal-container {
        background: white;
        border-radius: var(--border-radius-2xl);
        width: 90%;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-xl);
        animation: modalPop 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .modal-md {
        max-width: 600px;
      }

      .modal-sm {
        max-width: 500px;
      }

      .modal-header {
        padding: 20px 24px;
        border-bottom: 2px solid var(--neutral-200);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-header h2 {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--neutral-900);
      }

      .modal-close {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--neutral-500);
        transition: var(--transition-base);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-close:hover {
        background: var(--neutral-100);
        color: var(--neutral-900);
      }

      .modal-body {
        padding: 24px;
        overflow-y: auto;
        flex: 1;
      }

      .modal-footer {
        padding: 16px 24px;
        border-top: 1px solid var(--neutral-200);
        display: flex;
        justify-content: flex-end;
        gap: 12px;
      }

      /* ============================================ */
      /* FORMULÁRIO                                  */
      /* ============================================ */
      .form-group {
        margin-bottom: 18px;
      }

      .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--neutral-700);
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .form-group label.required::after {
        content: " *";
        color: var(--error-600);
        font-weight: 700;
      }

      .form-input {
        width: 100%;
        padding: 10px 14px;
        border: 2px solid var(--neutral-200);
        border-radius: var(--border-radius-lg);
        font-size: 0.9rem;
        transition: var(--transition-base);
        background: white;
        font-family: inherit;
      }

      .form-input:focus {
        outline: none;
        border-color: var(--primary-500);
        box-shadow: 0 0 0 4px var(--primary-100);
      }

      .form-input.error {
        border-color: var(--error-600);
        box-shadow: 0 0 0 4px var(--error-100);
      }

      .form-row-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .form-text {
        font-size: 0.75rem;
        color: var(--neutral-500);
        margin-top: 4px;
      }

      .form-hint {
        background: var(--primary-50);
        border: 1px solid var(--primary-200);
        border-radius: var(--border-radius-lg);
        padding: 12px 16px;
        font-size: 0.8rem;
        color: var(--primary-800);
        margin-bottom: 16px;
      }

      .form-hint i {
        margin-right: 8px;
      }

      /* ============================================ */
      /* CHECKBOX PERMISSÕES                         */
      /* ============================================ */
      .permissoes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 8px;
        margin-top: 8px;
      }

      .permissao-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: var(--neutral-50);
        border-radius: var(--border-radius-md);
        border: 1px solid var(--neutral-200);
      }

      .permissao-item input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--primary-600);
        cursor: pointer;
      }

      .permissao-item label {
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--neutral-700);
        cursor: pointer;
        text-transform: none;
      }

      .permissao-item .permissao-tipo {
        font-size: 0.65rem;
        font-weight: 600;
        color: var(--neutral-500);
        margin-left: auto;
      }

      /* ============================================ */
      /* MODAL DE CONFIRMAÇÃO                        */
      /* ============================================ */
      .modal-confirm {
        background: white;
        border-radius: var(--border-radius-2xl);
        padding: 40px 32px;
        max-width: 440px;
        width: 90%;
        text-align: center;
        box-shadow: var(--shadow-xl);
        animation: modalPop 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid var(--neutral-200);
      }

      .modal-confirm-icon {
        font-size: 56px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--warning-50);
        margin-left: auto;
        margin-right: auto;
      }

      .modal-confirm-title {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--neutral-900);
        margin-bottom: 12px;
      }

      .modal-confirm-message {
        font-size: 0.95rem;
        color: var(--neutral-600);
        margin-bottom: 28px;
        line-height: 1.6;
      }

      .modal-confirm-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes modalPop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* ============================================ */
      /* STATS FOOTER                                 */
      /* ============================================ */
      .stats-footer {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        padding: 16px 0;
        border-top: 1px solid var(--neutral-200);
        margin-top: 16px;
        font-size: 0.85rem;
        color: var(--neutral-500);
      }

      .stats-footer span {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .stats-footer strong {
        color: var(--neutral-800);
      }

      /* ============================================ */
      /* PAGINAÇÃO                                   */
      /* ============================================ */
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        padding: 16px 0;
        border-top: 1px solid var(--neutral-200);
      }

      .btn-page {
        padding: 8px 16px;
        border: 1px solid var(--neutral-200);
        background: white;
        border-radius: var(--border-radius-md);
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--neutral-700);
        transition: var(--transition-base);
      }

      .btn-page:hover:not(:disabled) {
        background: var(--neutral-50);
        border-color: var(--primary-300);
      }

      .btn-page:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .page-info {
        font-size: 0.85rem;
        color: var(--neutral-500);
        font-weight: 500;
      }

      /* ============================================ */
      /* RESPONSIVIDADE                               */
      /* ============================================ */
      @media (min-width: 769px) {
        .core-sidebar {
          transform: translateX(0) !important;
        }
        .core-main {
          margin-left: 260px;
        }
        .btn-toggle-sidebar {
          display: none;
        }
      }

      @media (max-width: 1024px) {
        .filters-bar {
          flex-direction: column;
          align-items: stretch;
        }
        .filter-group {
          min-width: auto;
        }
        .form-row-2 {
          grid-template-columns: 1fr;
        }
        .permissoes-grid {
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        }
      }

      @media (max-width: 768px) {
        .core-header {
          padding: 12px 16px;
        }
        .core-header .header-left h1 {
          font-size: 1.1rem;
        }
        .user-info span:not(.user-avatar) {
          display: none;
        }
        .usuarios-container {
          padding: 16px;
        }
        .page-header {
          flex-direction: column;
          align-items: stretch;
          gap: 12px;
        }
        .page-header h1 {
          font-size: 1.4rem;
        }
        .table-container {
          overflow-x: auto;
        }
        .table {
          font-size: 0.8rem;
        }
        .table th,
        .table td {
          padding: 10px 12px;
        }
        .btn {
          padding: 8px 14px;
          font-size: 0.8rem;
        }
        .modal-container {
          width: 95%;
          max-height: 95vh;
        }
        .stats-footer {
          flex-direction: column;
          gap: 8px;
          font-size: 0.8rem;
        }
        .permissoes-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 480px) {
        .usuarios-container {
          padding: 12px;
        }
        .page-header h1 {
          font-size: 1.2rem;
        }
        .filters-bar {
          padding: 16px;
        }
        .table th,
        .table td {
          padding: 8px 10px;
          font-size: 0.75rem;
        }
        .btn-sm {
          padding: 4px 8px;
          font-size: 0.7rem;
        }
        .toast {
          min-width: 90%;
          max-width: 90%;
        }
        .modal-confirm {
          padding: 24px 16px;
        }
      }

      /* ============================================ */
      /* IMPRESSÃO                                  */
      /* ============================================ */
      @media print {
        .core-header,
        .core-sidebar,
        .filters-bar,
        .btn,
        .btn-sm,
        .btn-page,
        .toast-container,
        .modal-overlay {
          display: none !important;
        }

        .core-main {
          margin-left: 0 !important;
        }

        .card {
          box-shadow: none !important;
          border: 1px solid #ccc !important;
          break-inside: avoid;
          page-break-inside: avoid;
        }

        .table th {
          background: #eee !important;
          color: #000 !important;
        }

        .table td {
          border-bottom: 1px solid #ddd !important;
        }

        .usuarios-container {
          padding: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ============================================ -->
    <!-- HEADER                                      -->
    <!-- ============================================ -->
    <header class="core-header" id="coreHeader">
      <div class="header-left">
        <button
          class="btn-toggle-sidebar"
          onclick="toggleSidebar()"
          aria-label="Toggle sidebar"
        >
          <i class="fas fa-bars"></i>
        </button>
        <h1><i class="fas fa-users"></i> Gestão de Usuários</h1>
      </div>
      <div class="header-right">
        <div class="user-info" id="userInfo">
          <span class="user-avatar" id="userAvatar">U</span>
          <span id="userName">Carregando...</span>
          <span class="badge-perfil" id="userPerfil">ADMIN</span>
        </div>
        <button class="btn btn-sm btn-outline" id="btnLogout">
          <i class="fas fa-sign-out-alt"></i> Sair
        </button>
      </div>
    </header>

    <!-- ============================================ -->
    <!-- SIDEBAR                                     -->
    <!-- ============================================ -->
    <aside class="core-sidebar" id="coreSidebar">
      <nav class="sidebar-nav">
        <ul>
          <li>
            <a href="/core/index.html">
              <i class="fas fa-home"></i> Dashboard
            </a>
          </li>
          <li>
            <a href="/core/orgaos/index.html">
              <i class="fas fa-building"></i> Órgãos
            </a>
          </li>
          <li class="active">
            <a href="/core/usuarios/index.html">
              <i class="fas fa-users"></i> Usuários
            </a>
          </li>
          <li>
            <a href="/core/permissoes/index.html">
              <i class="fas fa-lock"></i> Permissões
            </a>
          </li>
          <li><hr class="sidebar-divider" /></li>
          <li>
            <a href="/intranet.html">
              <i class="fas fa-arrow-left"></i> Voltar para Intranet
            </a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <span>Versão 2.0</span>
      </div>
    </aside>

    <!-- ============================================ -->
    <!-- MAIN CONTENT                                -->
    <!-- ============================================ -->
    <main class="core-main">
      <div class="usuarios-container" id="pageContent">
        <!-- Conteúdo renderizado via JavaScript -->
        <div class="loading-container" id="loadingContainer">
          <div class="loading-spinner"></div>
          <p>Carregando usuários...</p>
        </div>
      </div>
    </main>

    <!-- ============================================ -->
    <!-- TOAST CONTAINER                             -->
    <!-- ============================================ -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- ============================================ -->
    <!-- MODAL DE CONFIRMAÇÃO                        -->
    <!-- ============================================ -->
    <div id="confirmModal" class="modal-overlay" style="display: none">
      <div class="modal-confirm">
        <div class="modal-confirm-icon" id="confirmIcon">⚠️</div>
        <h3 class="modal-confirm-title" id="confirmTitle">Confirmar ação</h3>
        <p class="modal-confirm-message" id="confirmMessage">
          Tem certeza que deseja continuar?
        </p>
        <div class="modal-confirm-actions">
          <button class="btn btn-secondary" id="confirmCancelBtn">
            <i class="fas fa-times"></i> Cancelar
          </button>
          <button class="btn btn-primary" id="confirmOkBtn">
            <i class="fas fa-check"></i> Confirmar
          </button>
        </div>
      </div>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS                                    -->
    <!-- ============================================ -->
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
        }
      }
    </script>

    <script type="module">
      // ============================================
      // core/usuarios/index.html - Script Principal
      // ============================================

      import { supabase } from "/shared/js/supabase.js";
      import { UsuariosService } from "/shared/js/services/usuarios.service.js";
      import { OrgaosService } from "/shared/js/services/orgaos.service.js";
      import { auth } from "/shared/js/auth.js";

      // ============================================
      // VARIÁVEIS GLOBAIS
      // ============================================
      let usuarioAtual = null;
      let usuarios = [];
      let orgaos = [];
      let filtros = {
        status: "todos",
        perfil: "todos",
        orgao: "todos",
        busca: "",
      };
      let paginaAtual = 1;
      const itensPorPagina = 10;

      // ============================================
      // UTILITÁRIOS
      // ============================================
      function mostrarToast(tipo, titulo, mensagem, duracao = 4000) {
        const container = document.getElementById("toastContainer");
        const icones = {
          sucesso: "✅",
          erro: "❌",
          aviso: "⚠️",
          info: "ℹ️",
        };

        const toast = document.createElement("div");
        toast.className = `toast ${tipo}`;
        toast.innerHTML = `
                <span>${icones[tipo] || "ℹ️"}</span>
                <span><strong>${titulo}</strong><br>${mensagem}</span>
                <button class="btn-fechar" onclick="this.parentElement.remove()">✕</button>
            `;

        container.appendChild(toast);

        if (duracao > 0) {
          setTimeout(() => {
            if (toast.parentElement) {
              toast.style.opacity = "0";
              toast.style.transform = "translateX(20px)";
              setTimeout(() => toast.remove(), 300);
            }
          }, duracao);
        }
      }

      function formatarData(data) {
        if (!data) return "-";
        try {
          const d = new Date(data);
          return d.toLocaleDateString("pt-BR");
        } catch {
          return data;
        }
      }

      function mostrarLoading(show) {
        const container = document.getElementById("loadingContainer");
        if (container) {
          container.style.display = show ? "flex" : "none";
        }
        const content = document.querySelector(".usuarios-content");
        if (content) {
          content.style.display = show ? "none" : "block";
        }
      }

      // ============================================
      // SIDEBAR TOGGLE
      // ============================================
      window.toggleSidebar = function () {
        const sidebar = document.getElementById("coreSidebar");
        sidebar.classList.toggle("open");
      };

      // ============================================
      // AUTENTICAÇÃO
      // ============================================
      async function verificarAutenticacao() {
        try {
          const session = await auth.verificarSessao();
          if (!session) {
            window.location.href = "/index.html";
            return false;
          }

          const usuario = await auth.obterUsuarioAtual();
          if (!usuario) {
            window.location.href = "/index.html";
            return false;
          }

          // Verificar se é ADMIN
          if (usuario.perfil !== "ADMIN") {
            mostrarToast(
              "erro",
              "Acesso negado",
              "Apenas administradores podem acessar esta área.",
            );
            setTimeout(() => {
              window.location.href = "/intranet.html";
            }, 2000);
            return false;
          }

          usuarioAtual = usuario;
          return true;
        } catch (error) {
          console.error("Erro ao verificar autenticação:", error);
          window.location.href = "/index.html";
          return false;
        }
      }

      // ============================================
      // ATUALIZAR INTERFACE DO USUÁRIO
      // ============================================
      function atualizarInterfaceUsuario() {
        if (!usuarioAtual) return;

        document.getElementById("userName").textContent =
          usuarioAtual.nome || "Usuário";
        document.getElementById("userPerfil").textContent =
          usuarioAtual.perfil || "ADMIN";

        const avatar = document.getElementById("userAvatar");
        if (avatar && usuarioAtual.nome) {
          const iniciais = usuarioAtual.nome
            .split(" ")
            .map((n) => n[0])
            .join("")
            .substring(0, 2)
            .toUpperCase();
          avatar.textContent = iniciais;
        }
      }

      // ============================================
      // CARREGAR DADOS
      // ============================================
      async function carregarOrgaos() {
        try {
          orgaos = await OrgaosService.listarAtivos();
        } catch (error) {
          console.error("Erro ao carregar órgãos:", error);
          orgaos = [];
        }
      }

      // ============================================
      // CARREGAR USUÁRIOS - CORRIGIDO
      // ============================================
      async function carregarUsuarios() {
        try {
          mostrarLoading(true);

          const options = {};

          if (filtros.status === "ativo") {
            options.onlyActive = true;
          }

          if (filtros.busca) {
            options.search = filtros.busca;
          }

          if (filtros.orgao && filtros.orgao !== "todos") {
            options.orgaoId = parseInt(filtros.orgao);
          }

          if (filtros.perfil && filtros.perfil !== "todos") {
            options.perfil = filtros.perfil;
          }

          usuarios = await UsuariosService.listar(options);

          // Se for inativo, filtrar manualmente
          if (filtros.status === "inativo") {
            usuarios = usuarios.filter((u) => u.ativo === false);
          }

          // ============================================================
          // CORREÇÃO: Ordenar por nome com verificação de segurança
          // ============================================================
          usuarios.sort((a, b) => {
            const nomeA = a.nome || "";
            const nomeB = b.nome || "";
            return nomeA.localeCompare(nomeB);
          });

          renderizarUsuarios();
        } catch (error) {
          console.error("Erro ao carregar usuários:", error);
          mostrarToast(
            "erro",
            "Erro",
            "Não foi possível carregar os usuários.",
          );
        } finally {
          mostrarLoading(false);
        }
      }

      // ============================================
      // RENDERIZAR
      // ============================================
      function renderizarUsuarios() {
        const container = document.getElementById("pageContent");
        if (!container) return;

        const totalPaginas = Math.ceil(usuarios.length / itensPorPagina) || 1;
        if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;

        const inicio = (paginaAtual - 1) * itensPorPagina;
        const paginaUsuarios = usuarios.slice(inicio, inicio + itensPorPagina);

        // Opções para filtros
        const perfis = [
          { value: "todos", label: "Todos os perfis" },
          { value: "ADMIN", label: "Administrador" },
          { value: "SECRETARIO", label: "Secretário" },
          { value: "SOLICITANTE", label: "Solicitante" },
          { value: "ESTAGIARIO", label: "Estagiário" },
        ];

        const orgaoOptions = [
          { value: "todos", label: "Todos os órgãos" },
          ...orgaos.map((o) => ({ value: o.id, label: o.nome })),
        ];

        container.innerHTML = `
                <div class="usuarios-content">
                    <div class="page-header">
                        <h1><i class="fas fa-users"></i> Usuários</h1>
                        <button class="btn btn-primary" id="btnNovoUsuario">
                            <i class="fas fa-user-plus"></i> Novo Usuário
                        </button>
                    </div>

                    <div class="filters-bar">
                        <div class="filter-group">
                            <label><i class="fas fa-filter"></i> Status</label>
                            <select id="filtroStatus">
                                <option value="todos" ${filtros.status === "todos" ? "selected" : ""}>Todos</option>
                                <option value="ativo" ${filtros.status === "ativo" ? "selected" : ""}>Ativos</option>
                                <option value="inativo" ${filtros.status === "inativo" ? "selected" : ""}>Inativos</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><i class="fas fa-user-tag"></i> Perfil</label>
                            <select id="filtroPerfil">
                                ${perfis
                                  .map(
                                    (p) => `
                                    <option value="${p.value}" ${filtros.perfil === p.value ? "selected" : ""}>${p.label}</option>
                                `,
                                  )
                                  .join("")}
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><i class="fas fa-building"></i> Órgão</label>
                            <select id="filtroOrgao">
                                ${orgaoOptions
                                  .map(
                                    (o) => `
                                    <option value="${o.value}" ${filtros.orgao == o.value ? "selected" : ""}>${o.label}</option>
                                `,
                                  )
                                  .join("")}
                            </select>
                        </div>
                        <div class="filter-group" style="flex: 1;">
                            <label><i class="fas fa-search"></i> Buscar</label>
                            <input type="text" id="filtroBusca" placeholder="Nome ou e-mail..." value="${filtros.busca || ""}" />
                        </div>
                        <button class="btn btn-outline" id="btnLimparFiltros">
                            <i class="fas fa-undo-alt"></i> Limpar
                        </button>
                        <button class="btn btn-primary" id="btnAplicarFiltros">
                            <i class="fas fa-search"></i> Aplicar
                        </button>
                    </div>

                    <div class="card">
                        <div class="table-container">
                            ${renderizarTabela(paginaUsuarios)}
                        </div>
                        ${
                          usuarios.length > itensPorPagina
                            ? `
                            <div class="pagination">
                                <button class="btn-page" id="btnPagAnterior" ${paginaAtual <= 1 ? "disabled" : ""}>
                                    <i class="fas fa-chevron-left"></i> Anterior
                                </button>
                                <span class="page-info">Página ${paginaAtual} de ${totalPaginas}</span>
                                <button class="btn-page" id="btnPagProximo" ${paginaAtual >= totalPaginas ? "disabled" : ""}>
                                    Próximo <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                        `
                            : ""
                        }
                    </div>

                    <div class="stats-footer">
                        <span><i class="fas fa-users"></i> Total: <strong>${usuarios.length}</strong> usuários</span>
                        <span><i class="fas fa-check-circle" style="color: var(--success-600);"></i> Ativos: <strong>${usuarios.filter((u) => u.ativo).length}</strong></span>
                        <span><i class="fas fa-times-circle" style="color: var(--error-600);"></i> Inativos: <strong>${usuarios.filter((u) => !u.ativo).length}</strong></span>
                        <span><i class="fas fa-building"></i> Órgãos: <strong>${orgaos.length}</strong></span>
                    </div>
                </div>
            `;

        // Configurar eventos da página
        configurarEventosPagina();
      }

      // ============================================
      // RENDERIZAR TABELA
      // ============================================
      function renderizarTabela(usuariosList) {
        if (!usuariosList || usuariosList.length === 0) {
          return `
                    <div class="empty-state">
                        <span class="empty-icon"><i class="fas fa-users"></i></span>
                        <p>Nenhum usuário cadastrado.</p>
                        <button class="btn btn-primary btn-sm" onclick="document.getElementById('btnNovoUsuario').click()">
                            <i class="fas fa-user-plus"></i> Cadastrar primeiro usuário
                        </button>
                    </div>
                `;
        }

        const orgaosMap = {};
        orgaos.forEach((o) => {
          orgaosMap[o.id] = o;
        });

        return `
                <table class="table" id="tabelaUsuarios">
                    <thead>
                        <tr>
                            <th style="width: 30px;">#</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                            <th>Órgão</th>
                            <th>Status</th>
                            <th>Último Login</th>
                            <th style="min-width: 150px;">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${usuariosList
                          .map((u, index) => {
                            const num =
                              (paginaAtual - 1) * itensPorPagina + index + 1;
                            const perfilClass = u.perfil
                              ? u.perfil.toLowerCase()
                              : "solicitante";
                            const orgao = orgaosMap[u.orgao_id];
                            return `
                                <tr>
                                    <td style="text-align: center; color: var(--neutral-500);">${num}</td>
                                    <td><strong>${u.nome}</strong></td>
                                    <td>${u.email}</td>
                                    <td><span class="badge-perfil-sistema ${perfilClass}">${u.perfil || "SOLICITANTE"}</span></td>
                                    <td>${orgao ? orgao.nome : "-"}</td>
                                    <td>
                                        <span class="status-badge ${u.ativo ? "status-ativo" : "status-inativo"}">
                                            ${u.ativo ? "Ativo" : "Inativo"}
                                        </span>
                                    </td>
                                    <td>${u.ultimo_login ? formatarData(u.ultimo_login) : "-"}</td>
                                    <td class="acoes-cell">
                                        <button class="btn btn-sm btn-outline" onclick="editarUsuario(${u.id})" title="Editar">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button class="btn btn-sm btn-outline" onclick="gerenciarPermissoes(${u.id})" title="Permissões">
                                            <i class="fas fa-lock"></i>
                                        </button>
                                        ${
                                          u.ativo
                                            ? `<button class="btn btn-sm btn-danger" onclick="desativarUsuario(${u.id})" title="Desativar">
                                                <i class="fas fa-times-circle"></i>
                                               </button>`
                                            : `<button class="btn btn-sm btn-success" onclick="ativarUsuario(${u.id})" title="Ativar">
                                                <i class="fas fa-check-circle"></i>
                                               </button>`
                                        }
                                        <button class="btn btn-sm btn-danger" onclick="excluirUsuario(${u.id})" title="Excluir">
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                        <button class="btn btn-sm btn-outline" onclick="redefinirSenha(${u.id})" title="Redefinir Senha">
                                            <i class="fas fa-key"></i>
                                        </button>
                                    </td>
                                </tr>
                            `;
                          })
                          .join("")}
                    </tbody>
                </table>
            `;
      }

      // ============================================
      // CONFIGURAR EVENTOS DA PÁGINA
      // ============================================
      function configurarEventosPagina() {
        // Botão novo usuário
        document
          .getElementById("btnNovoUsuario")
          ?.addEventListener("click", () => {
            abrirModalUsuario();
          });

        // Botão aplicar filtros
        document
          .getElementById("btnAplicarFiltros")
          ?.addEventListener("click", () => {
            aplicarFiltros();
          });

        // Botão limpar filtros
        document
          .getElementById("btnLimparFiltros")
          ?.addEventListener("click", () => {
            limparFiltros();
          });

        // Filtros com change
        document
          .getElementById("filtroStatus")
          ?.addEventListener("change", () => aplicarFiltros());
        document
          .getElementById("filtroPerfil")
          ?.addEventListener("change", () => aplicarFiltros());
        document
          .getElementById("filtroOrgao")
          ?.addEventListener("change", () => aplicarFiltros());

        // Filtro busca com Enter
        document
          .getElementById("filtroBusca")
          ?.addEventListener("keypress", (e) => {
            if (e.key === "Enter") aplicarFiltros();
          });

        // Paginação
        document
          .getElementById("btnPagAnterior")
          ?.addEventListener("click", () => {
            if (paginaAtual > 1) {
              paginaAtual--;
              renderizarUsuarios();
            }
          });

        document
          .getElementById("btnPagProximo")
          ?.addEventListener("click", () => {
            const totalPaginas = Math.ceil(usuarios.length / itensPorPagina);
            if (paginaAtual < totalPaginas) {
              paginaAtual++;
              renderizarUsuarios();
            }
          });
      }

      // ============================================
      // FILTROS
      // ============================================
      function aplicarFiltros() {
        filtros.status =
          document.getElementById("filtroStatus")?.value || "todos";
        filtros.perfil =
          document.getElementById("filtroPerfil")?.value || "todos";
        filtros.orgao =
          document.getElementById("filtroOrgao")?.value || "todos";
        filtros.busca = document.getElementById("filtroBusca")?.value || "";
        paginaAtual = 1;
        carregarUsuarios();
      }

      function limparFiltros() {
        const statusSelect = document.getElementById("filtroStatus");
        const perfilSelect = document.getElementById("filtroPerfil");
        const orgaoSelect = document.getElementById("filtroOrgao");
        const buscaInput = document.getElementById("filtroBusca");

        if (statusSelect) statusSelect.value = "todos";
        if (perfilSelect) perfilSelect.value = "todos";
        if (orgaoSelect) orgaoSelect.value = "todos";
        if (buscaInput) buscaInput.value = "";

        filtros = {
          status: "todos",
          perfil: "todos",
          orgao: "todos",
          busca: "",
        };
        paginaAtual = 1;
        carregarUsuarios();
      }

      // ============================================
      // MODAL DE USUÁRIO
      // ============================================
      function abrirModalUsuario(id = null) {
        const isEdit = !!id;
        const usuario = isEdit ? usuarios.find((u) => u.id === id) : null;

        // Carregar órgãos para o select
        const orgaoOptions = [
          { value: "", label: "Selecione um órgão" },
          ...orgaos.map((o) => ({ value: o.id, label: o.nome })),
        ];

        const perfis = [
          { value: "ADMIN", label: "Administrador" },
          { value: "SECRETARIO", label: "Secretário" },
          { value: "SOLICITANTE", label: "Solicitante" },
          { value: "ESTAGIARIO", label: "Estagiário" },
        ];

        const modal = document.createElement("div");
        modal.className = "modal-overlay";
        modal.id = "modalUsuario";
        modal.innerHTML = `
                <div class="modal-container modal-md">
                    <div class="modal-header">
                        <h2><i class="fas ${isEdit ? "fa-edit" : "fa-user-plus"}"></i> ${isEdit ? "Editar" : "Novo"} Usuário</h2>
                        <button class="modal-close" onclick="fecharModal('modalUsuario')">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form id="formUsuario" novalidate>
                            <input type="hidden" id="usuarioId" value="${id || ""}">
                            
                            <div class="form-group">
                                <label class="required">Nome Completo</label>
                                <input type="text" id="usuarioNome" class="form-input" 
                                    value="${usuario?.nome || ""}" placeholder="Nome completo do usuário" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="required">E-mail</label>
                                <input type="email" id="usuarioEmail" class="form-input" 
                                    value="${usuario?.email || ""}" placeholder="usuario@prefeitura.gov.br" required>
                                <span class="form-text">O e-mail será usado para login no sistema.</span>
                            </div>
                            
                            <div class="form-group" id="senhaGroup" ${isEdit ? 'style="display: none;"' : ""}>
                                <label class="required">Senha</label>
                                <input type="password" id="usuarioSenha" class="form-input" 
                                    placeholder="Mínimo 6 caracteres" ${isEdit ? "" : "required"} autocomplete="new-password">
                                <span class="form-text">${isEdit ? "Deixe em branco para manter a senha atual." : "A senha deve ter no mínimo 6 caracteres."}</span>
                            </div>
                            
                            <div class="form-row-2">
                                <div class="form-group">
                                    <label class="required">Perfil</label>
                                    <select id="usuarioPerfil" class="form-input" required>
                                        ${perfis
                                          .map(
                                            (p) => `
                                            <option value="${p.value}" ${usuario?.perfil === p.value ? "selected" : ""}>${p.label}</option>
                                        `,
                                          )
                                          .join("")}
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Órgão</label>
                                    <select id="usuarioOrgao" class="form-input">
                                        ${orgaoOptions
                                          .map(
                                            (o) => `
                                            <option value="${o.value}" ${usuario?.orgao_id == o.value ? "selected" : ""}>${o.label}</option>
                                        `,
                                          )
                                          .join("")}
                                    </select>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label>Status</label>
                                <select id="usuarioStatus" class="form-input">
                                    <option value="true" ${usuario?.ativo !== false ? "selected" : ""}>Ativo</option>
                                    <option value="false" ${usuario?.ativo === false ? "selected" : ""}>Inativo</option>
                                </select>
                            </div>

                            ${
                              !isEdit
                                ? `
                                <div class="form-hint">
                                    <i class="fas fa-info-circle"></i>
                                    O usuário receberá um e-mail de confirmação após o cadastro.
                                    <br><br>
                                    <strong>Importante:</strong> A senha é definida no momento do cadastro. 
                                    Para redefinir a senha, use a opção "Esqueci minha senha" na tela de login.
                                </div>
                            `
                                : `
                                <div class="form-hint">
                                    <i class="fas fa-info-circle"></i>
                                    Para redefinir a senha do usuário, clique no ícone <i class="fas fa-key"></i> na lista.
                                </div>
                            `
                            }
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="fecharModal('modalUsuario')">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button class="btn btn-primary" id="btnSalvarUsuario">
                            <i class="fas fa-save"></i> ${isEdit ? "Atualizar" : "Salvar"}
                        </button>
                    </div>
                </div>
            `;

        document.body.appendChild(modal);

        // Se for edição, esconder campo de senha
        if (isEdit) {
          document.getElementById("senhaGroup").style.display = "none";
        }

        // Evento do botão salvar
        document
          .getElementById("btnSalvarUsuario")
          .addEventListener("click", () => {
            salvarUsuario(id);
          });

        // Fechar modal ao clicar fora
        modal.addEventListener("click", (e) => {
          if (e.target === modal) {
            fecharModal("modalUsuario");
          }
        });

        // Focar no primeiro campo
        setTimeout(() => {
          document.getElementById("usuarioNome")?.focus();
        }, 100);
      }

      // ============================================
      // SALVAR USUÁRIO
      // ============================================
      async function salvarUsuario(id) {
        const nomeInput = document.getElementById("usuarioNome");
        const nome = nomeInput?.value?.trim();
        const email = document.getElementById("usuarioEmail")?.value?.trim();
        const senha = document.getElementById("usuarioSenha")?.value;
        const perfil = document.getElementById("usuarioPerfil")?.value;
        const orgaoId = document.getElementById("usuarioOrgao")?.value;
        const ativo =
          document.getElementById("usuarioStatus")?.value === "true";

        if (!nome) {
          mostrarToast(
            "aviso",
            "Campo obrigatório",
            "Informe o nome do usuário.",
          );
          if (nomeInput) {
            nomeInput.focus();
            nomeInput.classList.add("error");
            setTimeout(() => nomeInput.classList.remove("error"), 3000);
          }
          return;
        }

        if (!email) {
          mostrarToast(
            "aviso",
            "Campo obrigatório",
            "Informe o e-mail do usuário.",
          );
          document.getElementById("usuarioEmail")?.focus();
          return;
        }

        if (!id && (!senha || senha.length < 6)) {
          mostrarToast(
            "aviso",
            "Campo obrigatório",
            "A senha deve ter no mínimo 6 caracteres.",
          );
          document.getElementById("usuarioSenha")?.focus();
          return;
        }

        const dados = {
          nome: nome,
          email: email,
          perfil: perfil || "SOLICITANTE",
          orgao_id: orgaoId ? parseInt(orgaoId) : null,
          ativo: ativo,
        };

        try {
          mostrarLoading(true);

          let resultado;
          if (id) {
            resultado = await UsuariosService.atualizar(id, dados);
            mostrarToast(
              "sucesso",
              "Atualizado",
              `Usuário "${dados.nome}" atualizado com sucesso!`,
            );
          } else {
            dados.senha = senha;
            resultado = await UsuariosService.criar(dados);
            mostrarToast(
              "sucesso",
              "Criado",
              `Usuário "${dados.nome}" criado com sucesso!`,
            );
          }

          fecharModal("modalUsuario");
          await carregarUsuarios();
        } catch (error) {
          console.error("Erro ao salvar usuário:", error);
          mostrarToast(
            "erro",
            "Erro",
            error.message || "Não foi possível salvar o usuário.",
          );
        } finally {
          mostrarLoading(false);
        }
      }

      // ============================================
      // AÇÕES DO USUÁRIO
      // ============================================
      window.editarUsuario = function (id) {
        abrirModalUsuario(id);
      };

      window.desativarUsuario = async function (id) {
        const usuario = usuarios.find((u) => u.id === id);
        if (!usuario) return;

        const confirmado = await showConfirm(
          "Desativar usuário",
          `Tem certeza que deseja desativar o usuário "${usuario.nome}"?\n\nO usuário não poderá mais acessar o sistema.`,
          "⚠️",
        );
        if (!confirmado) return;

        try {
          mostrarLoading(true);
          await UsuariosService.desativar(id);
          mostrarToast(
            "sucesso",
            "Desativado",
            `Usuário "${usuario.nome}" desativado com sucesso.`,
          );
          await carregarUsuarios();
        } catch (error) {
          console.error("Erro ao desativar usuário:", error);
          mostrarToast(
            "erro",
            "Erro",
            error.message || "Não foi possível desativar o usuário.",
          );
        } finally {
          mostrarLoading(false);
        }
      };

      window.ativarUsuario = async function (id) {
        const usuario = usuarios.find((u) => u.id === id);
        if (!usuario) return;

        try {
          mostrarLoading(true);
          await UsuariosService.ativar(id);
          mostrarToast(
            "sucesso",
            "Ativado",
            `Usuário "${usuario.nome}" ativado com sucesso.`,
          );
          await carregarUsuarios();
        } catch (error) {
          console.error("Erro ao ativar usuário:", error);
          mostrarToast(
            "erro",
            "Erro",
            error.message || "Não foi possível ativar o usuário.",
          );
        } finally {
          mostrarLoading(false);
        }
      };

      window.excluirUsuario = async function (id) {
        const usuario = usuarios.find((u) => u.id === id);
        if (!usuario) return;

        try {
          const dependencias = await UsuariosService.verificarDependencias(id);
          let mensagem = `Tem certeza que deseja excluir o usuário "${usuario.nome}"?\n\nEsta ação não pode ser desfeita.`;

          if (dependencias.temPedidos) {
            mensagem += "\n\n⚠️ Este usuário possui pedidos vinculados.";
          }
          if (dependencias.temProcessos) {
            mensagem += "\n\n⚠️ Este usuário possui processos vinculados.";
          }
          if (dependencias.temAtos) {
            mensagem += "\n\n⚠️ Este usuário possui atos oficiais vinculados.";
          }

          const confirmado = await showConfirm(
            "Excluir usuário",
            mensagem,
            "🗑️",
          );
          if (!confirmado) return;

          mostrarLoading(true);
          await UsuariosService.excluir(id);
          mostrarToast(
            "sucesso",
            "Excluído",
            `Usuário "${usuario.nome}" excluído com sucesso.`,
          );
          await carregarUsuarios();
        } catch (error) {
          console.error("Erro ao excluir usuário:", error);
          mostrarToast(
            "erro",
            "Erro",
            error.message || "Não foi possível excluir o usuário.",
          );
        } finally {
          mostrarLoading(false);
        }
      };

      // ============================================
      // REDEFINIR SENHA (via e-mail)
      // ============================================
      window.redefinirSenha = async function (id) {
        const usuario = usuarios.find((u) => u.id === id);
        if (!usuario) return;

        const confirmado = await showConfirm(
          "Enviar e-mail de redefinição",
          `Deseja enviar um e-mail para "${usuario.email}" com as instruções para redefinir a senha?`,
          "📧",
        );
        if (!confirmado) return;

        try {
          mostrarLoading(true);
          await UsuariosService.enviarRedefinicaoSenha(usuario.email);
          mostrarToast(
            "sucesso",
            "E-mail enviado",
            `Instruções para redefinir a senha enviadas para ${usuario.email}.`,
          );
        } catch (error) {
          console.error("Erro ao enviar e-mail de redefinição:", error);
          mostrarToast(
            "erro",
            "Erro",
            error.message || "Não foi possível enviar o e-mail.",
          );
        } finally {
          mostrarLoading(false);
        }
      };

      // ============================================
      // PERMISSÕES
      // ============================================
      window.gerenciarPermissoes = async function (usuarioId) {
        try {
          const usuario = usuarios.find((u) => u.id === usuarioId);
          if (!usuario) return;

          const permissoes = await UsuariosService.obterPermissoes(usuarioId);
          const modulos = UsuariosService.getModulos();

          const permissoesMap = {};
          permissoes.forEach((p) => {
            permissoesMap[p.modulo] = p.permissao;
          });

          const modal = document.createElement("div");
          modal.className = "modal-overlay";
          modal.id = "modalPermissoes";
          modal.innerHTML = `
                    <div class="modal-container modal-md">
                        <div class="modal-header">
                            <h2><i class="fas fa-lock"></i> Permissões - ${usuario.nome}</h2>
                            <button class="modal-close" onclick="fecharModal('modalPermissoes')">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="modal-body">
                            <div class="form-hint">
                                <i class="fas fa-info-circle"></i>
                                Defina quais módulos este usuário pode acessar.
                                <br><strong>Admin:</strong> Acesso total ao módulo.
                                <br><strong>Permitido:</strong> Acesso apenas leitura.
                            </div>
                            <form id="formPermissoes">
                                <input type="hidden" id="permissoesUsuarioId" value="${usuarioId}">
                                <div class="permissoes-grid">
                                    ${modulos
                                      .map((m) => {
                                        const permissao =
                                          permissoesMap[m.value] || "negado";
                                        return `
                                            <div class="permissao-item">
                                                <input type="checkbox" id="perm_${m.value}" 
                                                    ${permissao !== "negado" ? "checked" : ""}
                                                    onchange="togglePermissao('${m.value}')">
                                                <label for="perm_${m.value}">${m.label}</label>
                                                <select id="perm_tipo_${m.value}" class="permissao-tipo" 
                                                    ${permissao === "negado" ? "disabled" : ""}>
                                                    <option value="permitido" ${permissao === "permitido" ? "selected" : ""}>Leitura</option>
                                                    <option value="admin" ${permissao === "admin" ? "selected" : ""}>Admin</option>
                                                </select>
                                            </div>
                                        `;
                                      })
                                      .join("")}
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" onclick="fecharModal('modalPermissoes')">
                                <i class="fas fa-times"></i> Cancelar
                            </button>
                            <button class="btn btn-primary" id="btnSalvarPermissoes">
                                <i class="fas fa-save"></i> Salvar Permissões
                            </button>
                        </div>
                    </div>
                `;

          document.body.appendChild(modal);

          window.togglePermissao = function (modulo) {
            const checkbox = document.getElementById(`perm_${modulo}`);
            const select = document.getElementById(`perm_tipo_${modulo}`);
            if (select) {
              select.disabled = !checkbox.checked;
              if (!checkbox.checked) {
                select.value = "permitido";
              }
            }
          };

          document
            .getElementById("btnSalvarPermissoes")
            .addEventListener("click", async () => {
              await salvarPermissoes(usuarioId);
            });

          modal.addEventListener("click", (e) => {
            if (e.target === modal) {
              fecharModal("modalPermissoes");
            }
          });
        } catch (error) {
          console.error("Erro ao gerenciar permissões:", error);
          mostrarToast(
            "erro",
            "Erro",
            error.message || "Não foi possível carregar as permissões.",
          );
        }
      };

      async function salvarPermissoes(usuarioId) {
        try {
          const modulos = UsuariosService.getModulos();
          const permissoes = [];

          modulos.forEach((m) => {
            const checkbox = document.getElementById(`perm_${m.value}`);
            if (checkbox && checkbox.checked) {
              const select = document.getElementById(`perm_tipo_${m.value}`);
              const permissao = select ? select.value : "permitido";
              permissoes.push({
                modulo: m.value,
                permissao: permissao,
              });
            }
          });

          mostrarLoading(true);
          await UsuariosService.atualizarPermissoes(usuarioId, permissoes);
          mostrarToast(
            "sucesso",
            "Salvo",
            "Permissões atualizadas com sucesso!",
          );
          fecharModal("modalPermissoes");
        } catch (error) {
          console.error("Erro ao salvar permissões:", error);
          mostrarToast(
            "erro",
            "Erro",
            error.message || "Não foi possível salvar as permissões.",
          );
        } finally {
          mostrarLoading(false);
        }
      }

      // ============================================
      // FECHAR MODAL
      // ============================================
      window.fecharModal = function (id) {
        const modal = document.getElementById(id);
        if (modal) {
          modal.remove();
        }
      };

      // ============================================
      // MODAL DE CONFIRMAÇÃO
      // ============================================
      function showConfirm(title, message, icon = "⚠️") {
        return new Promise((resolve) => {
          const modal = document.getElementById("confirmModal");
          const confirmIcon = document.getElementById("confirmIcon");
          const confirmTitle = document.getElementById("confirmTitle");
          const confirmMessage = document.getElementById("confirmMessage");
          const confirmOkBtn = document.getElementById("confirmOkBtn");
          const confirmCancelBtn = document.getElementById("confirmCancelBtn");

          if (!modal) {
            resolve(confirm(`${icon} ${title}\n\n${message}`));
            return;
          }

          confirmIcon.textContent = icon;
          confirmTitle.textContent = title;
          confirmMessage.textContent = message;

          modal.style.display = "flex";

          function cleanup() {
            modal.style.display = "none";
            confirmOkBtn.removeEventListener("click", handleConfirm);
            confirmCancelBtn.removeEventListener("click", handleCancel);
            window.removeEventListener("click", handleClickOutside);
          }

          function handleConfirm() {
            cleanup();
            resolve(true);
          }

          function handleCancel() {
            cleanup();
            resolve(false);
          }

          function handleClickOutside(e) {
            if (e.target === modal) {
              cleanup();
              resolve(false);
            }
          }

          confirmOkBtn.addEventListener("click", handleConfirm);
          confirmCancelBtn.addEventListener("click", handleCancel);
          window.addEventListener("click", handleClickOutside);
        });
      }

      // ============================================
      // LOGOUT
      // ============================================
      document
        .getElementById("btnLogout")
        .addEventListener("click", async () => {
          const confirmado = await showConfirm(
            "Sair do sistema",
            "Tem certeza que deseja sair?",
            "🔓",
          );
          if (confirmado) {
            await auth.logout();
            window.location.href = "/index.html";
          }
        });

      // ============================================
      // INICIALIZAÇÃO
      // ============================================
      async function init() {
        const autenticado = await verificarAutenticacao();
        if (!autenticado) return;

        atualizarInterfaceUsuario();
        await carregarOrgaos();
        await carregarUsuarios();

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            const modals = document.querySelectorAll(".modal-overlay");
            modals.forEach((modal) => {
              if (modal.style.display !== "none") {
                modal.remove();
              }
            });
          }
        });
      }

      init();

      // ============================================
      // EXPOR FUNÇÕES GLOBAIS
      // ============================================
      window.mostrarToast = mostrarToast;
      window.formatarData = formatarData;
      window.showConfirm = showConfirm;
      window.fecharModal = fecharModal;
      window.editarUsuario = editarUsuario;
      window.desativarUsuario = desativarUsuario;
      window.ativarUsuario = ativarUsuario;
      window.excluirUsuario = excluirUsuario;
      window.gerenciarPermissoes = gerenciarPermissoes;
      window.redefinirSenha = redefinirSenha;
      window.togglePermissao = function (modulo) {
        const checkbox = document.getElementById(`perm_${modulo}`);
        const select = document.getElementById(`perm_tipo_${modulo}`);
        if (select) {
          select.disabled = !checkbox.checked;
          if (!checkbox.checked) {
            select.value = "permitido";
          }
        }
      };
    </script>
  </body>
</html>
