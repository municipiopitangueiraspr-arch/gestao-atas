    <link rel="stylesheet" href="../../shared/css/identidade-pitangueiras.css" />
<div class="pedido-container">
  <!-- ============================================================ -->
  <!-- ONDA 1 · BARRA DE AÇÕES RÁPIDAS                              -->
  <!-- ------------------------------------------------------------ -->
  <!-- Botões de atalho no topo da aba Pedidos:                    -->
  <!--   · [+ Novo Pedido]      → Consulta em modo compra          -->
  <!--   · [Carrinho (N)]       → View de Carrinho                 -->
  <!--   · [Fila de Aprovação]  → Só para SECRETARIO/ADMIN         -->
  <!-- O JS controla visibilidade e badges.                         -->
  <!-- ============================================================ -->
  <div class="pedidos-acoes-rapidas" id="pedidosAcoesRapidas">
    <button
      type="button"
      class="btn-acao-principal"
      id="btnNovoPedido"
      title="Ir para a Consulta em modo compra"
    >
      <i class="fas fa-plus-circle"></i>
      <span>Novo Pedido</span>
    </button>

    <button
      type="button"
      class="btn-acao-secundaria"
      id="btnIrParaCarrinho"
      title="Ver os itens no carrinho"
    >
      <i class="fas fa-shopping-cart"></i>
      <span>Carrinho</span>
      <span class="badge-acao badge-vazio" id="badgeCarrinhoAcoes">0</span>
    </button>

    <button
      type="button"
      class="btn-acao-secundaria btn-acao-fila"
      id="btnIrParaFila"
      title="Ver pedidos aguardando sua aprovação"
      style="display: none"
    >
      <i class="fas fa-clipboard-check"></i>
      <span>Fila de Aprovação</span>
      <span class="badge-acao badge-acao-alerta" id="badgeFilaAcoes">0</span>
    </button>
  </div>

  <!-- ============================================================ -->
  <!-- ONDA 3 · FILA DE APROVAÇÃO DESTACADA                          -->
  <!-- ------------------------------------------------------------ -->
  <!-- Bloco de destaque que só aparece para SECRETARIO/ADMIN        -->
  <!-- quando há pedidos aguardando aprovação. Conteúdo injetado     -->
  <!-- dinamicamente pelo método renderizarFilaAprovacao().          -->
  <!-- ============================================================ -->
  <div class="fila-aprovacao" id="filaAprovacao" style="display: none">
    <!-- Conteúdo dinâmico -->
  </div>

  <!-- ============================================================ -->
  <!-- ONDA 2 · COMPRA RÁPIDA                                        -->
  <!-- ------------------------------------------------------------ -->
  <!-- Bloco que permite criar pedido sem sair da aba Pedidos.       -->
  <!-- Fluxo: ata → item → qtd → adicionar ao carrinho.              -->
  <!-- ============================================================ -->
  <div class="compra-rapida" id="compraRapida">
    <div class="compra-rapida-header">
      <h3 class="compra-rapida-titulo">
        <i class="fas fa-bolt"></i> Compra Rápida
      </h3>
      <span class="compra-rapida-dica">
        Já sabe o que precisa? Adicione direto aqui.
      </span>
    </div>

    <div class="compra-rapida-grid">
      <div class="filtro-grupo compra-rapida-ata">
        <label class="filtro-label" for="compraRapidaAta">
          <i class="fas fa-file-contract"></i> Ata
        </label>
        <select id="compraRapidaAta" class="filtro-select">
          <option value="">🔍 Selecione uma ata...</option>
        </select>
      </div>

      <div class="filtro-grupo compra-rapida-item">
        <label class="filtro-label" for="compraRapidaItem">
          <i class="fas fa-box"></i> Item
        </label>
        <select id="compraRapidaItem" class="filtro-select" disabled>
          <option value="">Selecione uma ata primeiro...</option>
        </select>
      </div>

      <div class="filtro-grupo compra-rapida-qtd">
        <label class="filtro-label" for="compraRapidaQtd">
          <i class="fas fa-hashtag"></i> Quantidade
        </label>
        <input
          type="number"
          id="compraRapidaQtd"
          class="filtro-input"
          placeholder="0"
          min="1"
          disabled
        />
      </div>

      <div class="filtro-grupo compra-rapida-acao">
        <label class="filtro-label" aria-hidden="true">&nbsp;</label>
        <button
          type="button"
          class="btn-adicionar-rapido"
          id="btnCompraRapidaAdicionar"
          disabled
        >
          <i class="fas fa-cart-plus"></i>
          <span>Adicionar</span>
        </button>
      </div>
    </div>

    <div
      class="compra-rapida-preview"
      id="compraRapidaPreview"
      style="display: none"
    >
      <!-- Conteúdo dinâmico -->
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- INDICADORES RÁPIDOS                                           -->
  <!-- ------------------------------------------------------------ -->
  <!-- Os 4 cards são clicáveis e filtram a lista por status.        -->
  <!-- "Total" limpa o filtro (volta a "Todos"), os outros 3 aplicam -->
  <!-- o status correspondente. O JS conecta os cliques.            -->
  <!-- Os NÚMEROS mostram sempre o panorama global (não filtrado).   -->
  <!-- ============================================================ -->
  <div class="pedidos-indicadores">
    <div class="indicador-card indicador-clicavel" data-status="todos">
      <span class="indicador-numero" id="totalPedidos">0</span>
      <span class="indicador-label">Total</span>
    </div>
    <div
      class="indicador-card indicador-pendente indicador-clicavel"
      data-status="AGUARDANDO_APROVACAO"
    >
      <span class="indicador-numero" id="pendentesPedidos">0</span>
      <span class="indicador-label">Pendentes</span>
    </div>
    <div
      class="indicador-card indicador-aprovado indicador-clicavel"
      data-status="APROVADO"
    >
      <span class="indicador-numero" id="aprovadosPedidos">0</span>
      <span class="indicador-label">Aprovados</span>
    </div>
    <div
      class="indicador-card indicador-rejeitado indicador-clicavel"
      data-status="REJEITADO"
    >
      <span class="indicador-numero" id="rejeitadosPedidos">0</span>
      <span class="indicador-label">Rejeitados</span>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- FILTROS                                                       -->
  <!-- ============================================================ -->
  <div class="pedidos-filtros">
    <!-- ============================================================ -->
    <!-- Linha 1: Status (NOVO) + Nº Pedido + Nº Ata                  -->
    <!-- ------------------------------------------------------------ -->
    <!-- O select de Status é o PRIMEIRO filtro e define o "modo" da  -->
    <!-- tela: por padrão varia conforme o perfil do usuário (ADMIN/  -->
    <!-- SECRETARIO veem "Aguardando", SOLICITANTE/ESTAGIARIO veem    -->
    <!-- "Todos"). O JS cuida do default na inicialização.            -->
    <!-- ============================================================ -->
    <div class="pedidos-filtros-grid">
      <div class="filtro-grupo">
        <label class="filtro-label" for="filtroStatusAprovacao">
          <i class="fas fa-filter"></i> Status
        </label>
        <select id="filtroStatusAprovacao" class="filtro-select">
          <option value="AGUARDANDO_APROVACAO">⏳ Aguardando Aprovação</option>
          <option value="APROVADO">✅ Aprovados</option>
          <option value="REJEITADO">❌ Rejeitados</option>
          <option value="todos">📋 Todos</option>
        </select>
      </div>
      <div class="filtro-grupo">
        <label class="filtro-label" for="filtroNumeroPedido">
          <i class="fas fa-hashtag"></i> Nº Pedido
        </label>
        <input
          type="text"
          id="filtroNumeroPedido"
          class="filtro-input"
          placeholder="Ex: PED-2026-0001"
        />
      </div>
      <div class="filtro-grupo">
        <label class="filtro-label" for="filtroNumeroAta">
          <i class="fas fa-file-contract"></i> Nº Ata
        </label>
        <input
          type="text"
          id="filtroNumeroAta"
          class="filtro-input"
          placeholder="Ex: 74/2026"
        />
      </div>
    </div>

    <!-- Linha 2: Fornecedor (Autocomplete) -->
    <div class="pedidos-filtros-grid">
      <div class="filtro-grupo">
        <label class="filtro-label">
          <i class="fas fa-building"></i> Fornecedor
        </label>
        <div class="autocomplete-container" id="autocompleteFornecedorPedidos">
          <input
            type="text"
            id="fornecedorPedidoInput"
            class="filtro-input autocomplete-input"
            placeholder="Digite o nome ou CNPJ..."
            autocomplete="off"
          />
          <input type="hidden" id="fornecedorPedidoId" value="" />
          <div
            class="autocomplete-dropdown"
            id="autocompletePedidoDropdown"
          ></div>
        </div>
      </div>
    </div>

    <!-- Linha 3: Datas -->
    <div class="pedidos-filtros-grid">
      <div class="filtro-grupo">
        <label class="filtro-label">
          <i class="fas fa-calendar-plus"></i> Criado em
        </label>
        <div class="filtro-data-inputs">
          <input
            type="date"
            id="filtroDataCriacaoInicio"
            class="filtro-input filtro-data"
            placeholder="Início"
          />
          <span class="filtro-data-separador">até</span>
          <input
            type="date"
            id="filtroDataCriacaoFim"
            class="filtro-input filtro-data"
            placeholder="Fim"
          />
        </div>
      </div>
      <div class="filtro-grupo">
        <label class="filtro-label">
          <i class="fas fa-calendar-check"></i> Aprovado em
        </label>
        <div class="filtro-data-inputs">
          <input
            type="date"
            id="filtroDataAprovacaoInicio"
            class="filtro-input filtro-data"
            placeholder="Início"
          />
          <span class="filtro-data-separador">até</span>
          <input
            type="date"
            id="filtroDataAprovacaoFim"
            class="filtro-input filtro-data"
            placeholder="Fim"
          />
        </div>
      </div>
    </div>

    <!-- Botões -->
    <div class="pedidos-filtros-actions">
      <button class="btn-aplicar" id="btnFiltrarPedidos">
        <i class="fas fa-filter"></i> Filtrar
      </button>
      <button class="btn-limpar" id="btnLimparFiltrosPedidos">
        <i class="fas fa-eraser"></i> Limpar
      </button>
      <button class="btn-exportar" id="btnExportarPedidos">
        <i class="fas fa-download"></i> Exportar
      </button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- CONTADOR DE RESULTADOS                                        -->
  <!-- ============================================================ -->
  <div class="pedidos-contador">
    <span id="pedidosContador">Carregando pedidos...</span>
    <button
      class="btn-carregar-mais"
      id="btnCarregarMais"
      style="display: none"
    >
      <i class="fas fa-chevron-down"></i> Carregar mais 15
    </button>
  </div>

  <!-- ============================================================ -->
  <!-- LISTA DE PEDIDOS                                              -->
  <!-- ============================================================ -->
  <div id="pedidosLista" class="pedidos-lista-wrapper">
    <!-- Pedidos serão inseridos via JavaScript -->
  </div>
</div>

<!-- ============================================================ -->
<!-- ============================================================ -->
<!-- MODAL · FRACIONAR ENTREGAS                                    -->
<!-- ============================================================ -->
<!-- ------------------------------------------------------------ -->
<!-- Container principal do mini-modal de fracionamento. O conteúdo -->
<!-- é renderizado dinamicamente por pedidos.js::_abrirModal-      -->
<!-- Fracionar().                                                  -->
<!--                                                              -->
<!-- Estrutura esperada (renderizada pelo JS):                     -->
<!--   #modalFracionar.modal.active                                -->
<!--     .modal-content.modal-content-fracionar                    -->
<!--       .modal-header                                           -->
<!--       .modal-body-fracionar                                   -->
<!--         .fracionamento-info                                   -->
<!--         .fracionamento-tabela                                 -->
<!--           .fracionamento-linha (N)                            -->
<!--         .fracionamento-acoes-add                              -->
<!--         .fracionamento-total                                  -->
<!--       .modal-footer-fracionar                                 -->
<!--                                                              -->
<!-- O modal começa OCULTO (sem .active). O JS alterna.            -->
<!-- ============================================================ -->
<div id="modalFracionar" class="modal modal-fracionar">
  <div class="modal-content modal-content-fracionar" id="modalFracionarContent">
    <!-- Conteúdo dinâmico -->
  </div>
</div>

<!-- ============================================================ -->
<!-- MODAL · CONFIRMAR EXCLUSÃO DE CRONOGRAMA                      -->
<!-- ============================================================ -->
<!-- ------------------------------------------------------------ -->
<!-- Confirmação simples para excluir o cronograma de um item.    -->
<!-- Estrutura estática (não muda). O JS só abre/fecha e ajusta   -->
<!-- o texto com o nome do item.                                   -->
<!-- ============================================================ -->
<div
  id="modalConfirmarExclusaoFrac"
  class="modal modal-confirmar-exclusao-frac"
>
  <div class="modal-content modal-content-confirmar-exclusao-frac">
    <div class="modal-header modal-header-danger">
      <h2 class="modal-titulo">
        <i class="fas fa-exclamation-triangle"></i> Excluir Cronograma
      </h2>
      <button
        type="button"
        class="modal-close"
        id="btnFecharModalExclusaoFrac"
        title="Fechar"
      >
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="modal-body modal-body-exclusao-frac">
      <p class="exclusao-frac-mensagem">
        Tem certeza que deseja <strong>excluir</strong> o cronograma de entregas
        deste item?
      </p>
      <p class="exclusao-frac-item" id="exclusaoFracItemNome">
        <!-- Ex: Item #05 · Carne bovina -->
      </p>
      <div class="exclusao-frac-aviso">
        <i class="fas fa-info-circle"></i>
        <span
          >Esta ação não pode ser desfeita. O item volta a ficar sem
          cronograma.</span
        >
      </div>
    </div>

    <div class="modal-footer-fracionar">
      <button
        type="button"
        class="btn-cancelar-fracionar"
        id="btnCancelarExclusaoFrac"
      >
        <i class="fas fa-times"></i> Cancelar
      </button>
      <button
        type="button"
        class="btn-confirmar-exclusao-frac"
        id="btnConfirmarExclusaoFrac"
      >
        <i class="fas fa-trash"></i> Excluir Cronograma
      </button>
    </div>
  </div>
</div>
